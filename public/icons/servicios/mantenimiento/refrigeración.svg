<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Unidad Interior / Aire Acondicionado Split (Estructura Principal en Azul) -->
  <!-- Cuerpo principal del Split -->
  <rect 
    x="60" 
    y="80" 
    width="280" 
    height="130" 
    rx="20" 
    stroke="#0047D4" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Rejilla de salida de aire inferior / Deflector -->
  <path d="M90 170 H310" stroke="#0047D4" stroke-width="16" stroke-linecap="round" />
  
  <!-- Indicador / Display digital -->
  <circle cx="280" cy="125" r="6" stroke="#0047D4" stroke-width="16" />

  <!-- Copo de Nieve / Frío (Acento Cian) -->
  <!-- Ejes del copo -->
  <path d="M200 240 V340" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" />
  <path d="M150 290 H250" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" />
  <path d="M165 255 L235 325" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" />
  <path d="M165 325 L235 255" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" />

  <!-- Detalle / Remates de cristal de hielo -->
  <path d="M185 250 L200 265 L215 250" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M185 330 L200 315 L215 330" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M160 275 L175 290 L160 305" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M240 275 L225 290 L240 305" stroke="#00C9B7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
