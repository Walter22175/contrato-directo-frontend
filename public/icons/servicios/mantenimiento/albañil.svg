<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Albañilería - Contrato Directo">

  <defs>
    <linearGradient id="gradALB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroALB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradLadrillo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowALB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroALB)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowALB)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🧱 PARED DE LADRILLOS CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: los ladrillos se asientan -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Fila 1 (3 ladrillos) -->
      <rect x="-45" y="-38" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="-14" y="-38" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="17"  y="-38" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>

      <!-- Fila 2 (3 ladrillos desplazados) -->
      <rect x="-45" y="-18" width="14" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="-28" y="-18" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="3"   y="-18" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="34"  y="-18" width="11" height="16" rx="2" fill="url(#gradLadrillo)"/>

      <!-- Fila 3 (3 ladrillos) -->
      <rect x="-45" y="2" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="-14" y="2" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="17"  y="2" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>

      <!-- Fila 4 (3 ladrillos desplazados) -->
      <rect x="-45" y="22" width="14" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="-28" y="22" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="3"   y="22" width="28" height="16" rx="2" fill="url(#gradLadrillo)"/>
      <rect x="34"  y="22" width="11" height="16" rx="2" fill="url(#gradLadrillo)"/>

      <!-- Brillo general de la pared -->
      <rect x="-45" y="-38" width="90" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🪣 BALDE DE MEZCLA (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Asa del balde -->
      <path d="M -14 -18 Q 0 -30 14 -18"
            fill="none" stroke="url(#gradALB)" stroke-width="3.5"
            stroke-linecap="round"/>
      <!-- Cuerpo del balde -->
      <path d="M -18 -14 L 18 -14 L 14 22 L -14 22 Z"
            fill="url(#gradALB)"/>
      <!-- Borde superior -->
      <rect x="-20" y="-18" width="40" height="6" rx="2" fill="url(#gradALB)"/>
      <!-- Mezcla dentro (superficie grumosa) -->
      <ellipse cx="0" cy="-14" rx="16" ry="4" fill="#22C1E0" opacity="0.9"/>
      <circle cx="-6" cy="-14" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="4" cy="-13" r="1.5" fill="#ffffff" opacity="0.5"/>
      <!-- Goteo de mezcla -->
      <path d="M 8 22 Q 8 30 6 34 Q 4 38 6 40"
            fill="none" stroke="#22C1E0" stroke-width="3"
            stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Brillo del balde -->
      <path d="M -12 -10 L -8 18 L -4 18 L -8 -10 Z"
            fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- 🔨 MAZO / MARTILLO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g transform="rotate(-20)">
      <animateTransform attributeName="transform" type="rotate"
        values="-20; -8; -20" dur="2.4s" repeatCount="indefinite" additive="replace"/>
      <!-- Mango -->
      <rect x="-4" y="-10" width="8" height="60" rx="4" fill="url(#gradALB)"/>
      <!-- Cabeza del mazo -->
      <rect x="-26" y="-32" width="52" height="22" rx="4" fill="url(#gradALB)"/>
      <!-- Detalle del mazo (ranura) -->
      <rect x="18" y="-28" width="5" height="14" rx="2" fill="#0A2A66" opacity="0.5"/>
      <!-- Brillo -->
      <rect x="-22" y="-28" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- 🥄 PALETA / CUCHARA DE ALBAÑIL (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g transform="rotate(-25)">
      <animateTransform attributeName="transform" type="rotate"
        values="-25; -18; -25" dur="3s" repeatCount="indefinite" additive="replace"/>
      <!-- Mango -->
      <rect x="-4" y="-38" width="8" height="48" rx="4" fill="url(#gradALB)"/>
      <!-- Curva del mango hacia la hoja -->
      <path d="M -4 8 Q -4 18 4 22 L 4 14 Q 0 12 0 8 Z"
            fill="url(#gradALB)"/>
      <!-- Hoja romboidal -->
      <path d="M 0 18 L 16 30 L 4 48 L -12 36 Z"
            fill="url(#gradALB)"/>
      <!-- Brillo de la hoja -->
      <path d="M -4 24 L 6 32 L 2 38 L -6 30 Z"
            fill="#ffffff" opacity="0.35"/>
      <!-- Mezcla en la hoja -->
      <ellipse cx="2" cy="36" rx="6" ry="3" fill="#22C1E0" opacity="0.7"/>
    </g>
  </g>

  <!-- 📏 NIVEL / PLOMADA (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del nivel -->
      <rect x="-26" y="-8" width="52" height="16" rx="4" fill="url(#gradALB)"/>
      <!-- Burbuja izquierda -->
      <ellipse cx="-14" cy="0" rx="6" ry="4" fill="#ffffff" opacity="0.85"/>
      <circle cx="-14" cy="0" r="2" fill="#22C1E0">
        <animate attributeName="cx" values="-16;-12;-16" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Burbuja central -->
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#ffffff" opacity="0.85"/>
      <circle cx="0" cy="0" r="2.5" fill="#22C1E0">
        <animate attributeName="cx" values="-2;2;-2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Burbuja derecha -->
      <ellipse cx="14" cy="0" rx="6" ry="4" fill="#ffffff" opacity="0.85"/>
      <circle cx="14" cy="0" r="2" fill="#22C1E0">
        <animate attributeName="cx" values="12;16;12" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 👷 CASCO DE ALBAÑIL (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Borde inferior -->
      <ellipse cx="0" cy="8" rx="24" ry="5" fill="url(#gradALB)"/>
      <!-- Cúpula -->
      <path d="M -20 8 Q -20 -14 0 -18 Q 20 -14 20 8 Z" fill="url(#gradALB)"/>
      <!-- Cresta central -->
      <path d="M -1 -18 Q 0 -22 1 -18 L 2 8 L -2 8 Z" fill="#22C1E0" opacity="0.7"/>
      <!-- Brillo -->
      <ellipse cx="-7" cy="-6" rx="5" ry="2.5" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🧰 CEMENTO / BOLSA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Bolsa de cemento -->
      <path d="M -20 -18 L 20 -18 L 22 24 L -22 24 Z"
            fill="url(#gradALB)"/>
      <!-- Pliegue superior -->
      <path d="M -18 -18 L -14 -24 L 14 -24 L 18 -18 Z"
            fill="url(#gradALB)"/>
      <!-- Etiqueta -->
      <rect x="-14" y="-8" width="28" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
      <!-- Texto simulado -->
      <rect x="-10" y="-4" width="20" height="3" rx="1.5" fill="#0A2A66"/>
      <rect x="-10" y="2" width="14" height="2.5" rx="1.25" fill="#22C1E0"/>
      <rect x="-10" y="7" width="18" height="2.5" rx="1.25" fill="#1E6FE8"/>
      <!-- Polvo de cemento -->
      <circle cx="16" cy="-22" r="1.5" fill="#ffffff" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="-16" r="1" fill="#ffffff" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>