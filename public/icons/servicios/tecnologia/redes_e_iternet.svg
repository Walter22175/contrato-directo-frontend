<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Redes e Internet - Contrato Directo">

  <defs>
    <linearGradient id="gradRI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroRI" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradGlobo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowRI" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroRI)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowRI)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🌐 GLOBO TERRÁQUEO / RED CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el globo gira -->
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>

      <!-- Círculo del globo -->
      <circle r="52" fill="url(#gradGlobo)"/>
      <circle r="52" fill="none" stroke="#0A2A66" stroke-width="2" opacity="0.4"/>

      <!-- Meridianos -->
      <ellipse cx="0" cy="0" rx="52" ry="52" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="30" ry="52" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="10" ry="52" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>

      <!-- Paralelos -->
      <ellipse cx="0" cy="0" rx="52" ry="52" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="-18" rx="47" ry="8" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="18" rx="47" ry="8" fill="none"
               stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>

      <!-- Nodos de la red (puntos distribuidos) -->
      <g fill="#ffffff">
        <circle cx="-24" cy="-18" r="3"/>
        <circle cx="18" cy="-26" r="2.5"/>
        <circle cx="30" cy="4" r="3"/>
        <circle cx="-14" cy="26" r="2.5"/>
        <circle cx="-32" cy="14" r="2.5"/>
        <circle cx="8" cy="32" r="3"/>
      </g>

      <!-- Líneas de conexión entre nodos -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.6" fill="none">
        <line x1="-24" y1="-18" x2="18" y2="-26"/>
        <line x1="18" y1="-26" x2="30" y2="4"/>
        <line x1="30" y1="4" x2="8" y2="32"/>
        <line x1="8" y1="32" x2="-14" y2="26"/>
        <line x1="-14" y1="26" x2="-32" y2="14"/>
        <line x1="-32" y1="14" x2="-24" y2="-18"/>
        <line x1="-24" y1="-18" x2="8" y2="32"/>
      </g>

      <!-- Brillo superior -->
      <ellipse cx="-18" cy="-22" rx="14" ry="6" fill="#ffffff" opacity="0.35"/>

      <!-- Pulso de red -->
      <circle r="52" fill="none" stroke="#22C1E0" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="50;60;50" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📡 ANTENA / SATÉLITE (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Base de la antena -->
      <rect x="-14" y="16" width="28" height="6" rx="3" fill="url(#gradRI)"/>
      <rect x="-8" y="4" width="16" height="12" rx="2" fill="url(#gradRI)"/>
      <!-- Platillo parabólico -->
      <path d="M -26 -10 Q -26 -26 0 -26 Q 26 -26 26 -10 Q 20 -8 14 -8 Q 8 -8 0 -8 Q -8 -8 -14 -8 Q -20 -8 -26 -10 Z"
            fill="url(#gradRI)"/>
      <ellipse cx="0" cy="-10" rx="24" ry="6" fill="#0A2A66" opacity="0.6"/>
      <!-- Antena central -->
      <rect x="-2" y="-30" width="4" height="10" rx="2" fill="url(#gradRI)"/>
      <circle cx="0" cy="-32" r="3" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Ondas de señal saliendo -->
      <g fill="none" stroke="#22C1E0" stroke-width="2.5" stroke-linecap="round">
        <path d="M -34 -18 A 16 16 0 0 0 -34 -2">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 34 -18 A 16 16 0 0 1 34 -2">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- 🖥️ SERVIDOR / ROUTER (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del router -->
      <rect x="-28" y="-12" width="56" height="20" rx="4" fill="url(#gradRI)"/>
      <!-- Antenas del router -->
      <rect x="-20" y="-26" width="4" height="16" rx="2" fill="url(#gradRI)"/>
      <rect x="-2" y="-28" width="4" height="18" rx="2" fill="url(#gradRI)"/>
      <rect x="16" y="-26" width="4" height="16" rx="2" fill="url(#gradRI)"/>
      <circle cx="-18" cy="-28" r="2.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-30" r="2.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="-28" r="2.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Puertos en la parte inferior -->
      <g fill="#0A2A66" opacity="0.7">
        <rect x="-22" y="6" width="8" height="4" rx="1"/>
        <rect x="-10" y="6" width="8" height="4" rx="1"/>
        <rect x="2" y="6" width="8" height="4" rx="1"/>
        <rect x="14" y="6" width="8" height="4" rx="1"/>
      </g>
      <!-- LEDs -->
      <circle cx="-22" cy="2" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-14" cy="2" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-6" cy="2" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="2" cy="2" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 🔌 CABLE / FIBRA ÓPTICA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6; 6; -6" dur="3s" repeatCount="indefinite"/>
      <!-- Conector RJ45 -->
      <rect x="-18" y="-14" width="30" height="28" rx="4" fill="url(#gradRI)"/>
      <!-- Lengüeta del conector -->
      <rect x="-4" y="-18" width="8" height="6" rx="1" fill="url(#gradRI)"/>
      <!-- Pines del conector -->
      <g fill="#0A2A66" opacity="0.7">
        <rect x="-14" y="-8" width="4" height="16" rx="1"/>
        <rect x="-8" y="-8" width="4" height="16" rx="1"/>
        <rect x="-2" y="-8" width="4" height="16" rx="1"/>
        <rect x="4" y="-8" width="4" height="16" rx="1"/>
      </g>
      <!-- Cable saliendo -->
      <path d="M 12 0 Q 22 0 26 6 Q 30 12 26 18 Q 22 24 14 24"
            fill="none" stroke="url(#gradRI)" stroke-width="6"
            stroke-linecap="round"/>
      <!-- Luz de la fibra (pulso) -->
      <circle cx="12" cy="0" r="3" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="24" cy="10" r="2" fill="#22C1E0">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="24" cy="20" r="2" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📶 WIFI / SEÑAL (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Punto base -->
      <circle cx="0" cy="18" r="5" fill="url(#gradRI)"/>
      <!-- Arcos de señal WiFi -->
      <path d="M -14 6 A 20 20 0 0 1 14 6" fill="none"
            stroke="url(#gradRI)" stroke-width="4.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -26 -8 A 36 36 0 0 1 26 -8" fill="none"
            stroke="url(#gradRI)" stroke-width="4.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -38 -22 A 52 52 0 0 1 38 -22" fill="none"
            stroke="url(#gradRI)" stroke-width="4.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <!-- Chip WiFi dentro del punto -->
      <rect x="-3" y="15" width="6" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- 🔒 CANDADO / SEGURIDAD (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Arco del candado -->
      <path d="M -10 -6 L -10 -14 Q -10 -24 0 -24 Q 10 -24 10 -14 L 10 -6"
            fill="none" stroke="url(#gradRI)" stroke-width="5" stroke-linecap="round"/>
      <!-- Cuerpo del candado -->
      <rect x="-16" y="-6" width="32" height="26" rx="4" fill="url(#gradRI)"/>
      <!-- Ojo de la cerradura -->
      <circle cx="0" cy="4" r="3.5" fill="#0A2A66"/>
      <rect x="-1.5" y="4" width="3" height="7" rx="1" fill="#0A2A66"/>
      <!-- Brillo -->
      <rect x="-12" y="-4" width="24" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ⚡ VELOCIDAD / ANCHO DE BANDA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.1 1.1; 1 1" dur="1.4s" repeatCount="indefinite"/>
      <!-- Rayo -->
      <path d="M 4 -26 L -14 2 L -2 2 L -8 26 L 14 -4 L 2 -4 Z"
            fill="url(#gradRI)"/>
      <!-- Brillo -->
      <path d="M 4 -26 L -14 2 L -2 2 L -8 26 L 14 -4 L 2 -4 Z"
            fill="#ffffff" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- Líneas de velocidad -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="-22" y1="-14" x2="-28" y2="-18">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="-4" x2="-30" y2="-4">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="-22" y1="6" x2="-28" y2="10">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (bits) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>