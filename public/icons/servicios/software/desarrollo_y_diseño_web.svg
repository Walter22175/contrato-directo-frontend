<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Diseño y Desarrollo Web - Contrato Directo">

  <defs>
    <linearGradient id="gradDW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroDW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPantallaDW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowDW" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroDW)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowDW)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 💻 MONITOR CON CÓDIGO CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el monitor flota levemente -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Marco del monitor -->
      <rect x="-56" y="-44" width="112" height="76" rx="8" fill="url(#gradDW)"/>

      <!-- Barra superior del navegador -->
      <rect x="-56" y="-44" width="112" height="12" rx="8" fill="#0A2A66" opacity="0.8"/>
      <!-- Botones del navegador -->
      <circle cx="-48" cy="-38" r="2.5" fill="#22C1E0"/>
      <circle cx="-40" cy="-38" r="2.5" fill="#1E6FE8"/>
      <circle cx="-32" cy="-38" r="2.5" fill="#ffffff" opacity="0.6"/>
      <!-- Barra de URL -->
      <rect x="-24" y="-40" width="72" height="4" rx="2" fill="#ffffff" opacity="0.3"/>

      <!-- Pantalla interior -->
      <rect x="-50" y="-26" width="100" height="50" rx="3" fill="url(#gradPantallaDW)"/>

      <!-- Estructura de la página web (wireframe) -->
      <!-- Header -->
      <rect x="-44" y="-20" width="88" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
      <!-- Sidebar izquierdo -->
      <rect x="-44" y="-10" width="20" height="28" rx="2" fill="#ffffff" opacity="0.7"/>
      <!-- Contenido principal -->
      <rect x="-20" y="-10" width="64" height="12" rx="2" fill="#ffffff" opacity="0.85"/>
      <rect x="-20" y="4" width="40" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
      <rect x="-20" y="12" width="52" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
      <!-- Botón de acción -->
      <rect x="-20" y="18" width="20" height="6" rx="3" fill="#22C1E0"/>

      <!-- Cursor de código parpadeante -->
      <rect x="10" y="16" width="3" height="8" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Base del monitor -->
      <rect x="-10" y="32" width="20" height="6" rx="2" fill="url(#gradDW)"/>
      <rect x="-22" y="38" width="44" height="4" rx="2" fill="url(#gradDW)"/>

      <!-- Brillo superior -->
      <rect x="-52" y="-42" width="104" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🎨 PALETA DE DISEÑO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Cuerpo de la paleta -->
      <path d="M 0 -22
               Q -26 -22 -26 0
               Q -26 22 0 22
               Q 26 22 26 0
               Q 26 -8 18 -8
               Q 14 -8 14 -4
               Q 14 4 6 4
               Q -2 4 -2 -4
               Q -2 -14 -10 -14
               Q -18 -14 -18 -8
               Q -18 -2 -22 -2"
            fill="url(#gradDW)"/>
      <!-- Colores -->
      <circle cx="-14" cy="-6" r="4" fill="#22C1E0"/>
      <circle cx="-4" cy="-12" r="4" fill="#1E6FE8"/>
      <circle cx="6" cy="-8" r="4" fill="#0A2A66"/>
      <circle cx="14" cy="0" r="4" fill="#22C1E0" opacity="0.7"/>
      <circle cx="-10" cy="8" r="4" fill="#1E6FE8" opacity="0.7"/>
    </g>
  </g>

  <!-- ⚙️ ENGRANAJE / SETTINGS (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <!-- Dientes -->
      <path d="M 0 -22 L 5 -22 L 5 -17 L -5 -17 L -5 -22 Z
               M 0 22 L 5 22 L 5 17 L -5 17 L -5 22 Z
               M -22 0 L -22 -5 L -17 -5 L -17 5 L -22 5 Z
               M 22 0 L 22 -5 L 17 -5 L 17 5 L 22 5 Z
               M -15 -15 L -12 -18 L -15 -21 L -18 -18 Z
               M 15 -15 L 18 -18 L 15 -21 L 12 -18 Z
               M -15 15 L -18 18 L -15 21 L -12 18 Z
               M 15 15 L 12 18 L 15 21 L 18 18 Z"
            fill="url(#gradDW)"/>
      <circle r="15" fill="url(#gradDW)"/>
      <circle r="6" fill="#ffffff" opacity="0.9"/>
      <!-- Código dentro -->
      <text x="0" y="3" text-anchor="middle" font-family="monospace"
            font-size="8" font-weight="700" fill="#22C1E0">&lt;/&gt;</text>
    </g>
  </g>

  <!-- 🖱️ CURSOR / MOUSE (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 3; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Forma del cursor -->
      <path d="M -12 -20 L -12 12 L -4 4 L 2 16 L 8 12 L 2 0 L 12 0 Z"
            fill="url(#gradDW)"/>
      <!-- Brillo del cursor -->
      <path d="M -8 -16 L -8 4 L -2 -2 Z" fill="#ffffff" opacity="0.4"/>
      <!-- Clic (ondas) -->
      <circle cx="0" cy="0" r="14" fill="none"
              stroke="#22C1E0" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📱 DISEÑO RESPONSIVE (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Monitor grande -->
      <rect x="-24" y="-20" width="30" height="22" rx="2" fill="url(#gradDW)"/>
      <rect x="-21" y="-17" width="24" height="16" rx="1" fill="#0A2A66" opacity="0.8"/>
      <rect x="-20" y="2" width="12" height="3" rx="1" fill="url(#gradDW)"/>
      <rect x="-24" y="5" width="20" height="2" rx="1" fill="url(#gradDW)"/>

      <!-- Tablet -->
      <rect x="-8" y="-14" width="20" height="26" rx="3" fill="url(#gradDW)"/>
      <rect x="-6" y="-12" width="16" height="22" rx="1" fill="#0A2A66" opacity="0.8"/>

      <!-- Celular -->
      <rect x="14" y="-6" width="12" height="22" rx="3" fill="url(#gradDW)"/>
      <rect x="16" y="-4" width="8" height="16" rx="1" fill="#0A2A66" opacity="0.8"/>
      <circle cx="20" cy="14" r="1" fill="#22C1E0"/>

      <!-- Líneas de conexión -->
      <g stroke="#22C1E0" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" fill="none">
        <line x1="-9" y1="-10" x2="-8" y2="-8"/>
        <line x1="12" y1="-4" x2="14" y2="-4"/>
      </g>
    </g>
  </g>

  <!-- 📐 REGLA / GRID (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4; 4; -4" dur="3s" repeatCount="indefinite"/>
      <!-- Regla horizontal -->
      <rect x="-22" y="-6" width="44" height="10" rx="2" fill="url(#gradDW)"/>
      <!-- Regla vertical -->
      <rect x="-22" y="-6" width="10" height="40" rx="2" fill="url(#gradDW)"/>
      <!-- Marcas horizontales -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.8">
        <line x1="-18" y1="-6" x2="-18" y2="-2"/>
        <line x1="-12" y1="-6" x2="-12" y2="-2"/>
        <line x1="-6" y1="-6" x2="-6" y2="0"/>
        <line x1="0" y1="-6" x2="0" y2="-2"/>
        <line x1="6" y1="-6" x2="6" y2="-2"/>
        <line x1="12" y1="-6" x2="12" y2="-2"/>
        <line x1="18" y1="-6" x2="18" y2="-2"/>
      </g>
      <!-- Marcas verticales -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.8">
        <line x1="-22" y1="0" x2="-18" y2="0"/>
        <line x1="-22" y1="6" x2="-18" y2="6"/>
        <line x1="-22" y1="12" x2="-18" y2="12"/>
        <line x1="-22" y1="18" x2="-18" y2="18"/>
        <line x1="-22" y1="24" x2="-18" y2="24"/>
      </g>
      <!-- Cuadrícula (grid) -->
      <rect x="-2" y="0" width="8" height="8" fill="#22C1E0" opacity="0.6"/>
    </g>
  </g>

  <!-- 🚀 DEPLOY / LANZAMIENTO (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Cuerpo del cohete -->
      <path d="M 0 -24 Q -10 -12 -10 4 L 10 4 Q 10 -12 0 -24 Z"
            fill="url(#gradDW)"/>
      <!-- Ventana del cohete -->
      <circle cx="0" cy="-10" r="4" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="-10" r="2" fill="#22C1E0"/>
      <!-- Aletas -->
      <path d="M -10 -2 L -16 8 L -10 6 Z" fill="url(#gradDW)"/>
      <path d="M 10 -2 L 16 8 L 10 6 Z" fill="url(#gradDW)"/>
      <!-- Llama del cohete -->
      <path d="M -6 6 Q -4 16 0 20 Q 4 16 6 6 Z" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M -3 6 Q -2 14 0 16 Q 2 14 3 6 Z" fill="#ffffff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <!-- Estela -->
      <circle cx="0" cy="24" r="2" fill="#22C1E0" opacity="0.5">
        <animate attributeName="cy" values="22;32;22" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (bits) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>