<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A66"/>
      <stop offset="55%" stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>
    <radialGradient id="g4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#g4)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- VENTANA DE CODIGO CENTRAL (nucleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Marco de la ventana -->
      <rect x="-56" y="-42" width="112" height="84" rx="8" fill="url(#g1)"/>

      <!-- Barra superior de la ventana -->
      <rect x="-56" y="-42" width="112" height="16" rx="8" fill="#0A2A66" opacity="0.8"/>
      <rect x="-56" y="-26" width="112" height="4" fill="#0A2A66" opacity="0.8"/>

      <!-- Botones de la ventana (3 puntos) -->
      <circle cx="-46" cy="-34" r="3" fill="#22C1E0"/>
      <circle cx="-36" cy="-34" r="3" fill="#1E6FE8"/>
      <circle cx="-26" cy="-34" r="3" fill="#ffffff" opacity="0.6"/>

      <!-- Pantalla interior -->
      <rect x="-50" y="-20" width="100" height="56" rx="4" fill="url(#g3)"/>

      <!-- Lineas de codigo animadas -->
      <rect x="-44" y="-14" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9">
        <animate attributeName="width" values="30;54;30" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="-6" width="60" height="4" rx="2" fill="#ffffff" opacity="0.7">
        <animate attributeName="width" values="60;38;60" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="2" width="24" height="4" rx="2" fill="#ffffff" opacity="0.8">
        <animate attributeName="width" values="24;52;24" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="10" width="48" height="4" rx="2" fill="#ffffff" opacity="0.6">
        <animate attributeName="width" values="48;28;48" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="18" width="38" height="4" rx="2" fill="#ffffff" opacity="0.5"/>

      <!-- Cursor parpadeante -->
      <rect x="0" y="16" width="3" height="10" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Brillo superior -->
      <rect x="-52" y="-40" width="104" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ACTUALIZACION / UPDATE (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      <!-- Flecha circular 1 -->
      <path d="M -22 -6 A 22 22 0 0 1 22 -6" fill="none"
            stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 22 -6 L 16 -12 L 26 -12 Z" fill="url(#g1)"/>
      <!-- Flecha circular 2 -->
      <path d="M 22 6 A 22 22 0 0 1 -22 6" fill="none"
            stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
      <path d="M -22 6 L -16 12 L -26 12 Z" fill="url(#g1)"/>
      <!-- Centro -->
      <circle r="7" fill="url(#g3)"/>
      <circle r="3" fill="#22C1E0"/>
    </g>
  </g>

  <!-- BUG / ERROR CORREGIDO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del bug -->
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="url(#g1)"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-22" r="9" fill="url(#g1)"/>
      <!-- Ojos -->
      <circle cx="-4" cy="-24" r="2.5" fill="#ffffff"/>
      <circle cx="4" cy="-24" r="2.5" fill="#ffffff"/>
      <!-- Antenas -->
      <line x1="-5" y1="-30" x2="-10" y2="-40" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="-30" x2="10" y2="-40" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <!-- Patas (6) -->
      <line x1="-16" y1="-8" x2="-26" y2="-14" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="-8" x2="26" y2="-14" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="4" x2="-28" y2="4" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="4" x2="28" y2="4" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="14" x2="-26" y2="20" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="14" x2="26" y2="20" stroke="url(#g1)"
            stroke-width="2.5" stroke-linecap="round"/>
      <!-- Linea central -->
      <line x1="0" y1="-12" x2="0" y2="16" stroke="#ffffff"
            stroke-width="1.5" opacity="0.4"/>
      <!-- Tachado / correccion (cruz roja) -->
      <line x1="-20" y1="-26" x2="20" y2="26" stroke="#22C1E0"
            stroke-width="3.5" stroke-linecap="round" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="20" y1="-26" x2="-20" y2="26" stroke="#22C1E0"
            stroke-width="3.5" stroke-linecap="round" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- LLAVE / HERRAMIENTA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g transform="rotate(-20)">
      <animateTransform attributeName="transform" type="rotate"
        values="-20; -12; -20" dur="2.8s" repeatCount="indefinite" additive="replace"/>
      <!-- Mango -->
      <rect x="-5" y="-32" width="10" height="40" rx="5" fill="url(#g1)"/>
      <!-- Cabeza superior -->
      <path d="M -14 -32 Q -16 -46 -6 -49 L 6 -49 Q 16 -46 14 -32 L 8 -32
               Q 8 -40 0 -40 Q -8 -40 -8 -32 Z" fill="url(#g1)"/>
      <!-- Mandibula inferior -->
      <path d="M -14 8 Q -16 22 -6 25 L 6 25 Q 16 22 14 8 L 8 8
               Q 8 16 0 16 Q -8 16 -8 8 Z" fill="url(#g1)"/>
      <!-- Tuerca de ajuste -->
      <rect x="-8" y="-8" width="16" height="10" rx="2" fill="url(#g1)"/>
      <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <!-- Brillo -->
      <rect x="-3" y="-28" width="2" height="32" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ENGRANAJE / CONFIGURACION (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <!-- Dientes -->
      <path d="M 0 -24 L 6 -24 L 6 -18 L -6 -18 L -6 -24 Z
               M 0 24 L 6 24 L 6 18 L -6 18 L -6 24 Z
               M -24 0 L -24 -6 L -18 -6 L -18 6 L -24 6 Z
               M 24 0 L 24 -6 L 18 -6 L 18 6 L 24 6 Z
               M -17 -17 L -13 -21 L -17 -25 L -21 -21 Z
               M 17 -17 L 21 -21 L 17 -25 L 13 -21 Z
               M -17 17 L -21 21 L -17 25 L -13 21 Z
               M 17 17 L 13 21 L 17 25 L 21 21 Z"
            fill="url(#g1)"/>
      <circle r="17" fill="url(#g1)"/>
      <circle r="7" fill="#ffffff" opacity="0.9"/>
      <!-- Mini engranaje dentro -->
      <g>
        <path d="M 0 -5 L 1.5 -5 L 1.5 -3 L -1.5 -3 L -1.5 -5 Z
                 M 0 5 L 1.5 5 L 1.5 3 L -1.5 3 L -1.5 5 Z
                 M -5 0 L -5 -1.5 L -3 -1.5 L -3 1.5 L -5 1.5 Z
                 M 5 0 L 5 -1.5 L 3 -1.5 L 3 1.5 L 5 1.5 Z" fill="#22C1E0"/>
        <circle r="1.5" fill="#22C1E0"/>
      </g>
    </g>
  </g>

  <!-- PAQUETE / MODULO (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Caja 3D isometrica -->
      <path d="M 0 -22 L 22 -10 L 22 14 L 0 26 L -22 14 L -22 -10 Z"
            fill="url(#g1)"/>
      <!-- Tapa superior -->
      <path d="M 0 -22 L 22 -10 L 0 2 L -22 -10 Z" fill="url(#g3)"/>
      <!-- Linea central -->
      <line x1="0" y1="2" x2="0" y2="26" stroke="#ffffff"
            stroke-width="2" opacity="0.5"/>
      <!-- Brillo -->
      <path d="M -14 -12 L -6 -16 L -6 -8 L -14 -4 Z"
            fill="#ffffff" opacity="0.3"/>
      <!-- Numero de version simulado -->
      <rect x="-8" y="8" width="16" height="4" rx="1" fill="#ffffff" opacity="0.85"/>
      <rect x="-5" y="14" width="10" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- CHECK / VALIDACION (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.08 1.08; 1 1" dur="1.4s" repeatCount="indefinite"/>
      <!-- Circulo de fondo -->
      <circle r="22" fill="url(#g1)"/>
      <!-- Check grande -->
      <path d="M -12 2 L -4 10 L 12 -8" fill="none"
            stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="5" ry="3" fill="#ffffff" opacity="0.4"/>
      <!-- Pulso -->
      <circle r="22" fill="none" stroke="#22C1E0" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Chispas / particulas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>