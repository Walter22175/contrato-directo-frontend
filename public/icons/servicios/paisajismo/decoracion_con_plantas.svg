<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Decoración con Plantas - Contrato Directo">

  <defs>
    <linearGradient id="gradDP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroDP" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradMaceta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowDP" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroDP)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowDP)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🪴 MACETA CON PLANTA CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: la planta se balancea suavemente -->
      <animateTransform attributeName="transform" type="rotate"
        values="-2 0 30; 2 0 30; -2 0 30" dur="3.5s" repeatCount="indefinite"/>

      <!-- Tallo principal -->
      <path d="M 0 20 Q 0 0 0 -20"
            stroke="url(#gradDP)" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Hoja grande izquierda -->
      <path d="M 0 -10 Q -28 -18 -34 -38 Q -14 -34 0 -10 Z"
            fill="url(#gradMaceta)"/>
      <!-- Nervadura de la hoja izquierda -->
      <path d="M 0 -10 Q -16 -20 -30 -34"
            stroke="#0A2A66" stroke-width="1.5" fill="none" opacity="0.4"/>

      <!-- Hoja grande derecha -->
      <path d="M 0 -20 Q 28 -28 34 -48 Q 14 -44 0 -20 Z"
            fill="url(#gradMaceta)"/>
      <!-- Nervadura de la hoja derecha -->
      <path d="M 0 -20 Q 16 -30 30 -44"
            stroke="#0A2A66" stroke-width="1.5" fill="none" opacity="0.4"/>

      <!-- Hoja superior -->
      <path d="M 0 -20 Q -12 -36 -6 -52 Q 8 -46 0 -20 Z"
            fill="url(#gradMaceta)" opacity="0.85"/>

      <!-- Hoja pequeña inferior izquierda -->
      <path d="M 0 0 Q -20 -4 -26 -18 Q -10 -16 0 0 Z"
            fill="url(#gradMaceta)" opacity="0.7"/>

      <!-- Maceta (trapecio) -->
      <path d="M -28 20 L 28 20 L 22 54 L -22 54 Z"
            fill="url(#gradMaceta)"/>

      <!-- Borde superior de la maceta -->
      <rect x="-32" y="14" width="64" height="10" rx="3" fill="url(#gradDP)"/>

      <!-- Tierra dentro de la maceta -->
      <ellipse cx="0" cy="20" rx="26" ry="4" fill="#0A2A66" opacity="0.7"/>

      <!-- Brillo de la maceta -->
      <path d="M -18 26 L -12 50 L -4 50 L -10 26 Z"
            fill="#ffffff" opacity="0.3"/>

      <!-- Patrón decorativo de la maceta -->
      <path d="M -22 34 L 22 34" stroke="#0A2A66" stroke-width="1.5" opacity="0.3"/>
      <path d="M -20 44 L 20 44" stroke="#0A2A66" stroke-width="1.5" opacity="0.3"/>

      <!-- Brillo superior -->
      <rect x="-28" y="16" width="56" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🌿 HOJA DECORATIVA (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6; 6; -6" dur="3s" repeatCount="indefinite"/>
      <!-- Hoja grande -->
      <path d="M 0 -24 Q -22 -12 -22 6 Q -22 20 0 24 Q 22 20 22 6 Q 22 -12 0 -24 Z"
            fill="url(#gradDP)"/>
      <!-- Nervadura central -->
      <path d="M 0 -22 L 0 22" stroke="#0A2A66" stroke-width="2" opacity="0.5"/>
      <!-- Nervaduras laterales -->
      <g stroke="#0A2A66" stroke-width="1.5" opacity="0.4" fill="none">
        <path d="M 0 -14 Q -10 -10 -16 -4"/>
        <path d="M 0 -6 Q -10 -2 -16 4"/>
        <path d="M 0 2 Q -8 6 -14 12"/>
        <path d="M 0 -14 Q 10 -10 16 -4"/>
        <path d="M 0 -6 Q 10 -2 16 4"/>
        <path d="M 0 2 Q 8 6 14 12"/>
      </g>
      <!-- Brillo -->
      <ellipse cx="-6" cy="-12" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🏺 JARRÓN / FLORERO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuello del jarrón -->
      <rect x="-8" y="-24" width="16" height="10" rx="2" fill="url(#gradDP)"/>
      <!-- Cuerpo del jarrón (curvo) -->
      <path d="M -8 -14 Q -18 -8 -18 6 Q -18 22 0 24 Q 18 22 18 6 Q 18 -8 8 -14 Z"
            fill="url(#gradDP)"/>
      <!-- Flores dentro del jarrón -->
      <path d="M -4 -24 Q -10 -34 -6 -42" fill="none" stroke="#22C1E0" stroke-width="2" stroke-linecap="round"/>
      <path d="M 4 -24 Q 10 -32 6 -40" fill="none" stroke="#22C1E0" stroke-width="2" stroke-linecap="round"/>
      <!-- Flor izquierda -->
      <circle cx="-6" cy="-44" r="4" fill="#22C1E0"/>
      <circle cx="-6" cy="-44" r="1.5" fill="#ffffff"/>
      <!-- Flor derecha -->
      <circle cx="6" cy="-42" r="4" fill="#22C1E0"/>
      <circle cx="6" cy="-42" r="1.5" fill="#ffffff"/>
      <!-- Brillo del jarrón -->
      <ellipse cx="-6" cy="2" rx="3" ry="8" fill="#ffffff" opacity="0.4"/>
      <!-- Base -->
      <rect x="-10" y="22" width="20" height="4" rx="2" fill="url(#gradDP)"/>
    </g>
  </g>

  <!-- 🪴 MACETA COLGANTE (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4; 4; -4" dur="3.2s" repeatCount="indefinite"/>
      <!-- Cuerda / gancho -->
      <path d="M 0 -34 L 0 -22" stroke="url(#gradDP)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-36" r="3" fill="none" stroke="url(#gradDP)" stroke-width="2"/>
      <!-- Hojas colgando -->
      <g fill="url(#gradDP)">
        <path d="M -14 -16 Q -22 -6 -20 4 Q -12 -4 -8 -14 Z"/>
        <path d="M 14 -16 Q 22 -6 20 4 Q 12 -4 8 -14 Z"/>
        <path d="M -6 -18 Q -10 -4 -8 6 Q -2 -2 0 -14 Z"/>
        <path d="M 6 -18 Q 10 -4 8 6 Q 2 -2 0 -14 Z"/>
      </g>
      <!-- Maceta colgante (trapecio invertido) -->
      <path d="M -16 -14 L 16 -14 L 12 14 L -12 14 Z" fill="url(#gradDP)"/>
      <!-- Borde superior -->
      <rect x="-18" y="-18" width="36" height="6" rx="2" fill="url(#gradDP)"/>
      <!-- Tierra -->
      <ellipse cx="0" cy="-14" rx="14" ry="3" fill="#0A2A66" opacity="0.6"/>
      <!-- Brillo -->
      <path d="M -10 -10 L -6 10 L -2 10 L -6 -10 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🌵 CACTUS / SUCULENTA (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo principal del cactus -->
      <rect x="-8" y="-26" width="16" height="40" rx="8" fill="url(#gradDP)"/>
      <!-- Brazo izquierdo -->
      <path d="M -8 -10 L -18 -10 Q -24 -10 -24 -4 L -24 6 Q -24 10 -20 10 L -18 10 Q -14 10 -14 6 L -14 -6 Q -14 -6 -8 -6 Z"
            fill="url(#gradDP)"/>
      <!-- Brazo derecho -->
      <path d="M 8 -2 L 18 -2 Q 24 -2 24 4 L 24 12 Q 24 16 20 16 L 18 16 Q 14 16 14 12 L 14 2 Q 14 2 8 2 Z"
            fill="url(#gradDP)"/>
      <!-- Espinas -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.7">
        <line x1="0" y1="-22" x2="0" y2="-24"/>
        <line x1="0" y1="-14" x2="0" y2="-16"/>
        <line x1="0" y1="-6" x2="0" y2="-8"/>
        <line x1="0" y1="2" x2="0" y2="0"/>
        <line x1="-6" y1="-18" x2="-8" y2="-20"/>
        <line x1="6" y1="-18" x2="8" y2="-20"/>
        <line x1="-6" y1="-8" x2="-8" y2="-10"/>
        <line x1="6" y1="-8" x2="8" y2="-10"/>
      </g>
      <!-- Maceta del cactus -->
      <path d="M -14 14 L 14 14 L 11 30 L -11 30 Z" fill="url(#gradDP)"/>
      <rect x="-16" y="10" width="32" height="6" rx="2" fill="url(#gradDP)"/>
      <!-- Brillo -->
      <ellipse cx="-3" cy="-20" rx="2" ry="4" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 💧 REGADERA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6; 6; -6" dur="3s" repeatCount="indefinite"/>
      <!-- Cuerpo de la regadera -->
      <path d="M -12 -8 L 12 -8 L 10 14 L -10 14 Z" fill="url(#gradDP)"/>
      <!-- Tapa superior -->
      <rect x="-14" y="-12" width="28" height="6" rx="2" fill="url(#gradDP)"/>
      <!-- Pico vertedor -->
      <path d="M -12 -4 Q -22 -6 -24 -14 L -20 -16 Q -16 -10 -10 -10 Z"
            fill="url(#gradDP)"/>
      <!-- Boquilla con agujeros -->
      <ellipse cx="-22" cy="-14" rx="4" ry="3" fill="#0A2A66" opacity="0.6"/>
      <!-- Asa superior -->
      <path d="M -6 -12 Q -6 -22 0 -22 Q 6 -22 6 -12"
            fill="none" stroke="url(#gradDP)" stroke-width="3" stroke-linecap="round"/>
      <!-- Gotas cayendo -->
      <g fill="#22C1E0">
        <circle cx="-24" cy="-6" r="1.5">
          <animate attributeName="cy" values="-8;4;-8" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-20" cy="-4" r="1.2">
          <animate attributeName="cy" values="-6;6;-6" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-28" cy="-4" r="1.2">
          <animate attributeName="cy" values="-6;6;-6" dur="1.7s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.7s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Brillo -->
      <path d="M -8 -6 L -5 10 L -1 10 L -4 -6 Z" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ✂️ TIJERAS DE PODAR (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g transform="rotate(20)">
      <animateTransform attributeName="transform" type="rotate"
        values="20; 12; 20" dur="2.6s" repeatCount="indefinite" additive="replace"/>
      <!-- Hoja superior -->
      <path d="M -4 -22 L 3 -22 L 1 -2 L -3 -2 Z" fill="url(#gradDP)"/>
      <!-- Hoja inferior -->
      <path d="M -3 2 L 1 2 L 3 22 L -4 22 Z" fill="url(#gradDP)"/>
      <!-- Perno central -->
      <circle r="3" fill="url(#gradDP)"/>
      <circle r="1.2" fill="#ffffff"/>
      <!-- Anillo superior -->
      <circle cx="-9" cy="-28" r="6" fill="none" stroke="url(#gradDP)" stroke-width="3"/>
      <!-- Anillo inferior -->
      <circle cx="9" cy="28" r="6" fill="none" stroke="url(#gradDP)" stroke-width="3"/>
      <!-- Brillo -->
      <rect x="-2" y="-18" width="1.5" height="14" rx="0.75" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (polen) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>