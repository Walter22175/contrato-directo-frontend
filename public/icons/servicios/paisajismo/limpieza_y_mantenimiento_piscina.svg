<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Piscinas - Contrato Directo">

  <defs>
    <linearGradient id="gradPIS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPIS" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradAgua" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPIS" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPIS)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPIS)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🏊 PISCINA CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el agua ondula -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Borde exterior de la piscina -->
      <path d="M -62 -24 L 62 -24 L 66 26 Q 66 38 54 38 L -54 38 Q -66 38 -66 26 Z"
            fill="url(#gradPIS)"/>

      <!-- Interior de la piscina -->
      <path d="M -56 -18 L 56 -18 L 60 26 Q 60 34 50 34 L -50 34 Q -60 34 -60 26 Z"
            fill="#0A2A66" opacity="0.7"/>

      <!-- Agua -->
      <path d="M -56 -12 L 56 -12 L 60 26 Q 60 34 50 34 L -50 34 Q -60 34 -60 26 Z"
            fill="url(#gradAgua)" opacity="0.9"/>

      <!-- Ondas del agua (3 líneas) -->
      <path d="M -50 -6 Q -40 -12 -30 -6 Q -20 0 -10 -6 Q 0 -12 10 -6 Q 20 0 30 -6 Q 40 -12 50 -6"
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M -48 6 Q -38 0 -28 6 Q -18 12 -8 6 Q 2 0 12 6 Q 22 12 32 6 Q 42 0 48 6"
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <path d="M -46 18 Q -36 12 -26 18 Q -16 24 -6 18 Q 4 12 14 18 Q 24 24 34 18 Q 44 12 46 18"
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </path>

      <!-- Brillo superior del borde -->
      <path d="M -60 -22 L 60 -22 L 62 -18 L -62 -18 Z"
            fill="#ffffff" opacity="0.4"/>

      <!-- Escalera de acceso (esquina izquierda) -->
      <g>
        <rect x="-52" y="-20" width="3" height="40" fill="url(#gradPIS)"/>
        <rect x="-46" y="-20" width="3" height="40" fill="url(#gradPIS)"/>
        <rect x="-52" y="-14" width="9" height="3" fill="url(#gradPIS)"/>
        <rect x="-52" y="-2" width="9" height="3" fill="url(#gradPIS)"/>
        <rect x="-52" y="10" width="9" height="3" fill="url(#gradPIS)"/>
      </g>

      <!-- Trampolín (esquina derecha) -->
      <g>
        <rect x="44" y="-26" width="16" height="4" rx="2" fill="url(#gradPIS)"/>
        <rect x="50" y="-22" width="4" height="8" fill="url(#gradPIS)"/>
        <ellipse cx="52" cy="-28" rx="10" ry="3" fill="url(#gradPIS)"/>
      </g>
    </g>
  </g>

  <!-- 💦 CHORRO / CASCADA (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Caño del chorro -->
      <rect x="-16" y="-20" width="32" height="8" rx="3" fill="url(#gradPIS)"/>
      <!-- Boquilla -->
      <rect x="-10" y="-14" width="20" height="4" rx="2" fill="url(#gradPIS)"/>
      <!-- Chorro de agua principal -->
      <path d="M -6 -10 Q -8 4 0 14 Q 8 4 6 -10 Z" fill="url(#gradAgua)">
        <animate attributeName="opacity" values="1;0.6;1" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- Salpicaduras -->
      <g fill="#22C1E0">
        <circle cx="-8" cy="14" r="2">
          <animate attributeName="cy" values="10;22;10" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="8" cy="16" r="1.5">
          <animate attributeName="cy" values="12;24;12" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="20" r="1.5">
          <animate attributeName="cy" values="16;28;16" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- 🧹 LIMPIAFONDOS / RED (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Mango del limpiafondos -->
      <rect x="-3" y="-24" width="6" height="26" rx="3" fill="url(#gradPIS)"/>
      <!-- Cabezal del limpiafondos -->
      <rect x="-22" y="2" width="44" height="8" rx="3" fill="url(#gradPIS)"/>
      <!-- Red / cepillo -->
      <path d="M -22 10 L 22 10 L 18 24 L -18 24 Z"
            fill="url(#gradPIS)" opacity="0.6"/>
      <!-- Malla de la red -->
      <g stroke="#22C1E0" stroke-width="1" opacity="0.7">
        <line x1="-16" y1="10" x2="-14" y2="24"/>
        <line x1="-8" y1="10" x2="-7" y2="24"/>
        <line x1="0" y1="10" x2="0" y2="24"/>
        <line x1="8" y1="10" x2="7" y2="24"/>
        <line x1="16" y1="10" x2="14" y2="24"/>
        <line x1="-20" y1="15" x2="20" y2="15"/>
        <line x1="-19" y1="20" x2="19" y2="20"/>
      </g>
      <!-- Brillo -->
      <rect x="-18" y="4" width="36" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🧪 QUÍMICOS / CLORO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Frasco de químicos -->
      <rect x="-16" y="-16" width="32" height="40" rx="4" fill="url(#gradPIS)"/>
      <!-- Cuello del frasco -->
      <rect x="-8" y="-22" width="16" height="8" rx="2" fill="url(#gradPIS)"/>
      <!-- Tapa -->
      <rect x="-10" y="-26" width="20" height="6" rx="2" fill="url(#gradPIS)"/>
      <!-- Líquido dentro -->
      <rect x="-13" y="0" width="26" height="20" rx="2" fill="#22C1E0" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Etiqueta -->
      <rect x="-12" y="-10" width="24" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
      <!-- Símbolo químico -->
      <circle cx="0" cy="-5" r="3" fill="none" stroke="#0A2A66" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif"
            font-size="5" font-weight="800" fill="#0A2A66">Cl</text>
      <!-- Burbujas -->
      <circle cx="-6" cy="10" r="1.5" fill="#ffffff" opacity="0.8">
        <animate attributeName="cy" values="18;4;18" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="4" cy="14" r="1" fill="#ffffff" opacity="0.7">
        <animate attributeName="cy" values="20;6;20" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 🌡️ TERMÓMETRO / CLIMATIZACIÓN (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del termómetro -->
      <rect x="-6" y="-26" width="12" height="36" rx="6" fill="url(#gradPIS)"/>
      <!-- Bulbo inferior -->
      <circle cx="0" cy="14" r="10" fill="url(#gradPIS)"/>
      <!-- Columna de mercurio -->
      <rect x="-3" y="-20" width="6" height="34" rx="3" fill="#22C1E0">
        <animate attributeName="height" values="34;20;34" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-20;-6;-20" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bulbo interno -->
      <circle cx="0" cy="14" r="6" fill="#22C1E0"/>
      <!-- Marcas de temperatura -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.7">
        <line x1="-6" y1="-20" x2="-3" y2="-20"/>
        <line x1="-6" y1="-12" x2="-3" y2="-12"/>
        <line x1="-6" y1="-4" x2="-3" y2="-4"/>
        <line x1="-6" y1="4" x2="-3" y2="4"/>
      </g>
      <!-- Rayos de calor -->
      <g stroke="#22C1E0" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
        <line x1="14" y1="-14" x2="20" y2="-18">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="16" y1="-2" x2="22" y2="-2">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="14" y1="10" x2="20" y2="14">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- 🪜 ESCALERA / TRAMPOLÍN (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Escalera de acceso -->
      <rect x="-14" y="-20" width="4" height="40" fill="url(#gradPIS)"/>
      <rect x="-4" y="-20" width="4" height="40" fill="url(#gradPIS)"/>
      <!-- Peldaños -->
      <rect x="-14" y="-16" width="14" height="3" fill="url(#gradPIS)"/>
      <rect x="-14" y="-6" width="14" height="3" fill="url(#gradPIS)"/>
      <rect x="-14" y="4" width="14" height="3" fill="url(#gradPIS)"/>
      <rect x="-14" y="14" width="14" height="3" fill="url(#gradPIS)"/>
      <!-- Trampolín -->
      <rect x="4" y="-16" width="16" height="4" rx="2" fill="url(#gradPIS)"/>
      <rect x="10" y="-12" width="4" height="20" fill="url(#gradPIS)"/>
      <!-- Base del trampolín -->
      <rect x="4" y="8" width="20" height="4" rx="2" fill="url(#gradPIS)"/>
      <!-- Brillo -->
      <rect x="4" y="-18" width="16" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 💡 ILUMINACIÓN SUBACUÁTICA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Foco de luz subacuático -->
      <circle r="14" fill="url(#gradPIS)"/>
      <circle r="8" fill="#22C1E0" opacity="0.9">
        <animate attributeName="r" values="8;10;8" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Rayos de luz -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="16" y1="-6" x2="22" y2="-8">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="18" y1="0" x2="26" y2="0">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="16" y1="6" x2="22" y2="8">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- Burbujas -->
      <circle cx="-4" cy="12" r="2" fill="#ffffff" opacity="0.7">
        <animate attributeName="cy" values="14;0;14" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (gotas) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>