<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A66"/>
      <stop offset="55%" stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>
    <radialGradient id="g4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#g4)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- EDIFICIO COMERCIAL CENTRAL (nucleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Cuerpo del edificio -->
      <rect x="-38" y="-38" width="76" height="76" rx="4" fill="url(#g1)"/>

      <!-- Ventanas (grid 3x3) -->
      <g fill="#0A2A66" opacity="0.55">
        <rect x="-30" y="-30" width="16" height="16" rx="1"/>
        <rect x="-8" y="-30" width="16" height="16" rx="1"/>
        <rect x="14" y="-30" width="16" height="16" rx="1"/>
        <rect x="-30" y="-8" width="16" height="16" rx="1"/>
        <rect x="-8" y="-8" width="16" height="16" rx="1"/>
        <rect x="14" y="-8" width="16" height="16" rx="1"/>
        <rect x="-30" y="14" width="16" height="16" rx="1"/>
        <rect x="-8" y="14" width="16" height="16" rx="1"/>
        <rect x="14" y="14" width="16" height="16" rx="1"/>
      </g>

      <!-- Ventanas iluminadas (animadas) -->
      <rect x="-8" y="-30" width="16" height="16" rx="1" fill="#22C1E0" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" y="-8" width="16" height="16" rx="1" fill="#22C1E0" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-30" y="14" width="16" height="16" rx="1" fill="#22C1E0" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Entrada principal -->
      <rect x="-10" y="26" width="20" height="12" rx="2" fill="#0A2A66" opacity="0.85"/>
      <rect x="-8" y="28" width="16" height="8" rx="1" fill="#22C1E0" opacity="0.8"/>

      <!-- Techo terraza -->
      <rect x="-42" y="-42" width="84" height="6" rx="2" fill="url(#g3)"/>

      <!-- Jardinera en la terraza -->
      <rect x="-16" y="-48" width="12" height="8" rx="2" fill="url(#g3)"/>
      <circle cx="-10" cy="-52" r="5" fill="#22C1E0" opacity="0.9"/>
      <rect x="4" y="-48" width="12" height="8" rx="2" fill="url(#g3)"/>
      <circle cx="10" cy="-52" r="5" fill="#22C1E0" opacity="0.9"/>

      <!-- Base / suelo -->
      <rect x="-46" y="36" width="92" height="6" rx="3" fill="#0A2A66" opacity="0.7"/>

      <!-- Brillo superior -->
      <rect x="-36" y="-36" width="72" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ARBOL DECORATIVO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 0 30; 2 0 30; -2 0 30" dur="3.5s" repeatCount="indefinite"/>
      <rect x="-4" y="-6" width="8" height="30" fill="url(#g1)"/>
      <circle cx="-12" cy="-14" r="14" fill="url(#g3)"/>
      <circle cx="12" cy="-14" r="14" fill="url(#g3)"/>
      <circle cx="0" cy="-26" r="16" fill="url(#g3)"/>
      <ellipse cx="-6" cy="-30" rx="8" ry="4" fill="#ffffff" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-8" cy="-18" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="8" cy="-22" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="-32" r="2" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- MACETA GRANDE (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M 0 -8 Q -10 -22 -6 -32 Q 6 -28 0 -8 Z" fill="url(#g1)"/>
      <path d="M 0 -8 Q 10 -22 6 -32 Q -6 -28 0 -8 Z" fill="url(#g1)"/>
      <circle cx="0" cy="-34" r="4" fill="url(#g1)"/>
      <path d="M -22 -4 L 22 -4 L 16 28 L -16 28 Z" fill="url(#g1)"/>
      <rect x="-26" y="-10" width="52" height="8" rx="3" fill="url(#g3)"/>
      <ellipse cx="0" cy="-4" rx="22" ry="4" fill="#0A2A66" opacity="0.5"/>
      <path d="M -14 2 L -10 24 L -6 24 L -10 2 Z" fill="#ffffff" opacity="0.3"/>
      <path d="M -18 8 L 18 8" stroke="#0A2A66" stroke-width="1.5" opacity="0.3"/>
      <path d="M -16 18 L 16 18" stroke="#0A2A66" stroke-width="1.5" opacity="0.3"/>
    </g>
  </g>

  <!-- SETO / ARBUSTO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Base del seto -->
      <rect x="-22" y="10" width="44" height="14" rx="3" fill="url(#g1)"/>
      <!-- Forma del seto (curva) -->
      <path d="M -22 10 Q -22 -10 -10 -14 Q 0 -18 10 -14 Q 22 -10 22 10 Z"
            fill="url(#g3)"/>
      <!-- Textura del seto (puntitos) -->
      <g fill="#ffffff" opacity="0.4">
        <circle cx="-14" cy="2" r="1.5"/>
        <circle cx="-6" cy="-4" r="1.5"/>
        <circle cx="2" cy="-6" r="1.5"/>
        <circle cx="10" cy="-2" r="1.5"/>
        <circle cx="16" cy="4" r="1.5"/>
        <circle cx="-10" cy="6" r="1.5"/>
        <circle cx="6" cy="4" r="1.5"/>
      </g>
      <!-- Brillo superior -->
      <path d="M -18 -4 Q 0 -12 18 -4" fill="none"
            stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    </g>
  </g>

  <!-- RIEGO / ASPERSION (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4 0 20; 4 0 20; -4 0 20" dur="3s" repeatCount="indefinite"/>
      <!-- Aspersor -->
      <rect x="-4" y="10" width="8" height="20" rx="2" fill="url(#g1)"/>
      <rect x="-10" y="4" width="20" height="8" rx="3" fill="url(#g3)"/>
      <!-- Cabeza del aspersor -->
      <circle cx="0" cy="0" r="8" fill="url(#g1)"/>
      <circle cx="0" cy="0" r="3" fill="#22C1E0"/>
      <!-- Gotas / spray -->
      <g fill="#22C1E0">
        <circle cx="-14" cy="-8" r="2">
          <animate attributeName="cy" values="-8;-20;-8" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="-10" r="2.5">
          <animate attributeName="cy" values="-10;-24;-10" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="-8" r="2">
          <animate attributeName="cy" values="-8;-20;-8" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-8" cy="-4" r="1.5">
          <animate attributeName="cy" values="-4;-16;-4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="8" cy="-4" r="1.5">
          <animate attributeName="cy" values="-4;-16;-4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Base -->
      <rect x="-12" y="28" width="24" height="4" rx="2" fill="url(#g1)"/>
    </g>
  </g>

  <!-- PLANO / BOCETO (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <path d="M -20 -22 L 12 -22 L 20 -14 L 20 22 L -20 22 Z" fill="url(#g1)"/>
      <path d="M 12 -22 L 12 -14 L 20 -14 Z" fill="#0A2A66" opacity="0.5"/>
      <g stroke="#ffffff" stroke-width="0.8" opacity="0.5">
        <line x1="-16" y1="-14" x2="16" y2="-14"/>
        <line x1="-16" y1="-6" x2="16" y2="-6"/>
        <line x1="-16" y1="2" x2="16" y2="2"/>
        <line x1="-16" y1="10" x2="16" y2="10"/>
        <line x1="-12" y1="-18" x2="-12" y2="18"/>
        <line x1="-4" y1="-18" x2="-4" y2="18"/>
        <line x1="4" y1="-18" x2="4" y2="18"/>
        <line x1="12" y1="-18" x2="12" y2="18"/>
      </g>
      <path d="M -12 14 Q -4 0 4 4 Q 10 6 14 14"
            fill="none" stroke="#22C1E0" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-6" cy="-2" r="3" fill="#22C1E0"/>
      <circle cx="6" cy="2" r="2.5" fill="#22C1E0"/>
      <circle cx="0" cy="12" r="2" fill="#22C1E0" opacity="0.7"/>
      <path d="M -18 -20 L 10 -20 L 8 -18 L -16 -18 Z" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- DETALLE PREMIUM (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.08 1.08; 1 1" dur="1.6s" repeatCount="indefinite"/>
      <!-- Círculo de fondo -->
      <circle r="22" fill="url(#g1)"/>
      <!-- Estrella de calidad -->
      <path d="M 0 -16 L 5 -5 L 16 -5 L 7 3 L 10 14 L 0 7 L -10 14 L -7 3 L -16 -5 L -5 -5 Z"
            fill="#ffffff"/>
      <path d="M 0 -12 L 3 -4 L 12 -4 L 5 2 L 7 10 L 0 5 L -7 10 L -5 2 L -12 -4 L -3 -4 Z"
            fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="-6" cy="-10" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Chispas / particulas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>