<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Instalación de Césped - Contrato Directo">

  <defs>
    <linearGradient id="gradIC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroIC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradCesped" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowIC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroIC)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowIC)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🌱 ROLLO DE CÉSPED CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el césped se agita suavemente -->
      <animateTransform attributeName="transform" type="rotate"
        values="-1.5 0 20; 1.5 0 20; -1.5 0 20" dur="3.5s" repeatCount="indefinite"/>

      <!-- Base / terreno -->
      <rect x="-56" y="20" width="112" height="20" rx="3" fill="#0A2A66" opacity="0.6"/>

      <!-- Rollo de césped (cilindro) -->
      <ellipse cx="0" cy="-20" rx="52" ry="14" fill="url(#gradCesped)"/>
      <rect x="-52" y="-20" width="104" height="40" fill="url(#gradCesped)"/>
      <ellipse cx="0" cy="20" rx="52" ry="14" fill="url(#gradIC)"/>

      <!-- Espiral del rollo (líneas curvas) -->
      <g fill="none" stroke="#0A2A66" stroke-width="1.5" opacity="0.5">
        <ellipse cx="0" cy="-20" rx="40" ry="10"/>
        <ellipse cx="0" cy="-20" rx="28" ry="7"/>
        <ellipse cx="0" cy="-20" rx="16" ry="4"/>
      </g>

      <!-- Centro del rollo (núcleo) -->
      <ellipse cx="0" cy="-20" rx="8" ry="3" fill="#ffffff" opacity="0.9"/>

      <!-- Césped sobresaliendo del rollo (puntas) -->
      <g fill="#22C1E0">
        <path d="M -50 -30 L -48 -42 L -44 -30 Z"/>
        <path d="M -40 -32 L -38 -46 L -34 -32 Z"/>
        <path d="M -30 -34 L -28 -48 L -24 -34 Z"/>
        <path d="M -20 -34 L -18 -50 L -14 -34 Z"/>
        <path d="M -10 -34 L -8 -48 L -4 -34 Z"/>
        <path d="M 0 -34 L 2 -52 L 6 -34 Z"/>
        <path d="M 10 -34 L 12 -48 L 16 -34 Z"/>
        <path d="M 20 -34 L 22 -50 L 26 -34 Z"/>
        <path d="M 30 -34 L 32 -46 L 36 -34 Z"/>
        <path d="M 40 -32 L 42 -44 L 46 -32 Z"/>
        <path d="M 48 -30 L 50 -42 L 52 -30 Z"/>
      </g>

      <!-- Brillo superior del rollo -->
      <ellipse cx="-14" cy="-26" rx="20" ry="3" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🟩 SUPERFICIE VERDE / CÉSPED INSTALADO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Franja de césped vista desde arriba -->
      <rect x="-26" y="-16" width="52" height="32" rx="3" fill="url(#gradIC)"/>
      <!-- Franjas de corte del césped (líneas) -->
      <g stroke="#0A2A66" stroke-width="1" opacity="0.4">
        <line x1="-16" y1="-16" x2="-16" y2="16"/>
        <line x1="-6" y1="-16" x2="-6" y2="16"/>
        <line x1="4" y1="-16" x2="4" y2="16"/>
        <line x1="14" y1="-16" x2="14" y2="16"/>
      </g>
      <!-- Puntas de pasto -->
      <g fill="#22C1E0">
        <path d="M -22 -16 L -20 -22 L -18 -16 Z"/>
        <path d="M -12 -16 L -10 -24 L -8 -16 Z"/>
        <path d="M -2 -16 L 0 -26 L 2 -16 Z"/>
        <path d="M 8 -16 L 10 -24 L 12 -16 Z"/>
        <path d="M 18 -16 L 20 -22 L 22 -16 Z"/>
      </g>
      <!-- Brillo -->
      <rect x="-22" y="-14" width="44" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🪣 RODILLO / COMPACTADOR (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4; 0 0" dur="2s" repeatCount="indefinite"/>
      <!-- Mango del rodillo -->
      <rect x="-3" y="-28" width="6" height="24" rx="3" fill="url(#gradIC)"/>
      <!-- Cilindro rodillo -->
      <ellipse cx="0" cy="4" rx="26" ry="8" fill="url(#gradCesped)"/>
      <rect x="-26" y="-4" width="52" height="16" fill="url(#gradCesped)"/>
      <ellipse cx="0" cy="-4" rx="26" ry="8" fill="url(#gradIC)"/>
      <!-- Eje / soporte -->
      <rect x="-6" y="-14" width="12" height="12" rx="2" fill="url(#gradIC)"/>
      <!-- Brillo del cilindro -->
      <ellipse cx="-10" cy="-6" rx="12" ry="2" fill="#ffffff" opacity="0.4"/>
      <!-- Líneas de compactado (movimiento) -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <line x1="-40" y1="6" x2="-32" y2="6">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="-42" y1="14" x2="-32" y2="14">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
        </line>
        <line x1="32" y1="6" x2="40" y2="6">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
        </line>
        <line x1="32" y1="14" x2="42" y2="14">
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- 🧻 ROLLO EXTENDIDO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4; 4; -4" dur="3s" repeatCount="indefinite"/>
      <!-- Rollo de césped enrollado -->
      <ellipse cx="0" cy="0" rx="18" ry="20" fill="url(#gradIC)"/>
      <!-- Espiral -->
      <g fill="none" stroke="#0A2A66" stroke-width="1.5" opacity="0.5">
        <ellipse cx="0" cy="0" rx="14" ry="16"/>
        <ellipse cx="0" cy="0" rx="9" ry="10"/>
        <ellipse cx="0" cy="0" rx="4" ry="5"/>
      </g>
      <!-- Núcleo del rollo -->
      <circle r="2.5" fill="#ffffff" opacity="0.9"/>
      <!-- Césped sobresaliendo -->
      <g fill="#22C1E0">
        <path d="M -14 -18 L -12 -26 L -10 -18 Z"/>
        <path d="M -4 -20 L -2 -28 L 0 -20 Z"/>
        <path d="M 6 -20 L 8 -28 L 10 -20 Z"/>
        <path d="M 14 -18 L 16 -26 L 18 -18 Z"/>
      </g>
      <!-- Cinta envolviendo (extremo) -->
      <path d="M 18 -8 L 26 -6 L 26 6 L 18 8 Z" fill="url(#gradIC)" opacity="0.8"/>
      <!-- Brillo -->
      <ellipse cx="-6" cy="-10" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🪴 PLANTA DECORATIVA (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2 0 20; 2 0 20; -2 0 20" dur="3.2s" repeatCount="indefinite"/>
      <!-- Tallo principal -->
      <path d="M 0 22 Q 0 4 0 -10" stroke="url(#gradIC)"
            stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Hojas -->
      <path d="M 0 0 Q -18 -4 -16 -16 Q -6 -12 0 0 Z" fill="url(#gradIC)"/>
      <path d="M 0 -8 Q 18 -12 16 -24 Q 6 -20 0 -8 Z" fill="url(#gradIC)"/>
      <path d="M 0 -14 Q -10 -22 -6 -32 Q 4 -28 0 -14 Z" fill="url(#gradIC)" opacity="0.9"/>
      <!-- Maceta -->
      <path d="M -14 22 L 14 22 L 11 40 L -11 40 Z" fill="url(#gradIC)"/>
      <rect x="-16" y="18" width="32" height="6" rx="2" fill="url(#gradIC)"/>
      <!-- Tierra -->
      <ellipse cx="0" cy="22" rx="13" ry="3" fill="#0A2A66" opacity="0.6"/>
      <!-- Brillo -->
      <path d="M -8 26 L -6 38 L -2 38 L -4 26 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 📏 CINTA MÉTRICA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g transform="rotate(-15)">
      <animateTransform attributeName="transform" type="rotate"
        values="-15; -8; -15" dur="3s" repeatCount="indefinite" additive="replace"/>
      <!-- Caja de la cinta -->
      <circle r="14" fill="url(#gradIC)"/>
      <circle r="8" fill="#0A2A66" opacity="0.6"/>
      <circle r="3" fill="#22C1E0"/>
      <!-- Cinta saliendo -->
      <path d="M 14 -6 L 26 -4 L 26 4 L 14 6 Z" fill="url(#gradIC)"/>
      <!-- Marcas -->
      <g stroke="#ffffff" stroke-width="1.2" opacity="0.8">
        <line x1="16" y1="-3" x2="16" y2="3"/>
        <line x1="19" y1="-3" x2="19" y2="3"/>
        <line x1="22" y1="-3" x2="22" y2="3"/>
      </g>
      <!-- Gancho -->
      <rect x="26" y="-8" width="4" height="16" rx="1.5" fill="url(#gradIC)"/>
      <!-- Brillo -->
      <ellipse cx="-6" cy="-8" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ✂️ CUCHILLO / TIJERAS DE CÉSPED (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g transform="rotate(15)">
      <animateTransform attributeName="transform" type="rotate"
        values="15; 8; 15" dur="2.8s" repeatCount="indefinite" additive="replace"/>
      <!-- Mango del cuchillo -->
      <rect x="-6" y="-28" width="12" height="26" rx="4" fill="url(#gradIC)"/>
      <!-- Detalles del mango -->
      <rect x="-6" y="-22" width="12" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
      <rect x="-6" y="-14" width="12" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
      <!-- Hoja del cuchillo -->
      <path d="M -6 -2 L 6 -2 L 4 26 L -4 26 Z" fill="url(#gradIC)"/>
      <!-- Brillo de la hoja -->
      <path d="M -3 0 L 0 0 L -2 22 L -4 22 Z" fill="#ffffff" opacity="0.4"/>
      <!-- Corte de césped (línea ondulada) -->
      <path d="M -16 30 Q -10 26 -4 30 Q 2 34 8 30 Q 14 26 20 30"
            fill="none" stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (gotas de agua) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>