<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A66"/>
      <stop offset="55%" stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>
    <radialGradient id="g4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#g4)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- TIJERAS DE PODAR CENTRALES (nucleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g transform="rotate(-15)">
      <animateTransform attributeName="transform" type="rotate"
        values="-15; -8; -15" dur="2.6s" repeatCount="indefinite" additive="replace"/>

      <!-- Hoja superior -->
      <path d="M -6 -52 L 4 -52 L 2 -6 L -4 -6 Z" fill="url(#g3)"/>
      <path d="M -6 -52 L 4 -52 L 2 -58 L -4 -58 Z" fill="url(#g3)"/>

      <!-- Hoja inferior -->
      <path d="M -4 6 L 2 6 L 4 52 L -6 52 Z" fill="url(#g3)"/>
      <path d="M -6 58 L 4 58 L 2 52 L -4 52 Z" fill="url(#g3)"/>

      <!-- Perno central -->
      <circle r="6" fill="url(#g1)"/>
      <circle r="2.5" fill="#ffffff" opacity="0.9"/>

      <!-- Anillo superior (mango) -->
      <circle cx="-14" cy="-64" r="10" fill="none"
              stroke="url(#g1)" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate"
          values="-3 -14 -64; 3 -14 -64; -3 -14 -64" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Anillo inferior (mango) -->
      <circle cx="14" cy="64" r="10" fill="none"
              stroke="url(#g1)" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate"
          values="3 14 64; -3 14 64; 3 14 64" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Ramitas cortadas cayendo -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
        <line x1="22" y1="-12" x2="34" y2="-20">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="26" y1="2" x2="38" y2="-2">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="16" x2="36" y2="20">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.7s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- ARBOL PODADO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-1.5 0 30; 1.5 0 30; -1.5 0 30" dur="3.5s" repeatCount="indefinite"/>
      <rect x="-4" y="-4" width="8" height="30" fill="url(#g1)"/>
      <ellipse cx="0" cy="-16" rx="20" ry="16" fill="url(#g3)"/>
      <path d="M -16 -16 L 16 -16" stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <path d="M -12 -8 L 12 -8" stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <path d="M -8 -24 L 8 -24" stroke="#0A2A66" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="-6" cy="-22" rx="6" ry="3" fill="#ffffff" opacity="0.4"/>
      <line x1="-18" y1="-6" x2="-22" y2="-2" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="-10" x2="22" y2="-6" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-32" x2="0" y2="-36" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- RAMAS CORTADAS (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M -22 6 Q -10 2 0 -4 Q 10 -10 22 -8"
            fill="none" stroke="url(#g1)" stroke-width="4" stroke-linecap="round"/>
      <path d="M -14 2 Q -18 -4 -14 -8 Q -10 -4 -14 2 Z" fill="url(#g3)"/>
      <path d="M -2 -4 Q -6 -10 -2 -14 Q 2 -10 -2 -4 Z" fill="url(#g3)"/>
      <path d="M 10 -8 Q 6 -14 10 -18 Q 14 -14 10 -8 Z" fill="url(#g3)"/>
      <path d="M -8 14 Q 0 10 8 10 Q 16 8 20 12"
            fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 2 10 Q 0 4 4 2 Q 6 6 2 10 Z" fill="url(#g3)"/>
      <path d="M 14 10 Q 12 4 16 2 Q 18 6 14 10 Z" fill="url(#g3)"/>
      <ellipse cx="-6" cy="-2" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- GUANTE DE JARDINERIA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4 0 0; 4 0 0; -4 0 0" dur="3.2s" repeatCount="indefinite"/>
      <path d="M -14 -14 L 10 -14 L 14 -4 L 14 20 L -14 20 Z" fill="url(#g1)"/>
      <path d="M -14 -10 L -22 -6 L -22 2 L -14 4 Z" fill="url(#g1)"/>
      <rect x="2" y="-22" width="6" height="10" rx="3" fill="url(#g1)"/>
      <rect x="10" y="-20" width="6" height="8" rx="3" fill="url(#g1)"/>
      <rect x="-4" y="-22" width="6" height="10" rx="3" fill="url(#g1)"/>
      <path d="M -14 12 L 14 12" stroke="#0A2A66" stroke-width="1.5" opacity="0.5"/>
      <path d="M -10 -10 L -6 16 L -2 16 L -6 -10 Z" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- MACETA CON PLANTA (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="4 0 20; -4 0 20; 4 0 20" dur="3.2s" repeatCount="indefinite"/>
      <path d="M 0 -8 Q -10 -22 -6 -32 Q 6 -28 0 -8 Z" fill="url(#g1)"/>
      <path d="M 0 -8 Q 10 -22 6 -32 Q -6 -28 0 -8 Z" fill="url(#g1)"/>
      <circle cx="0" cy="-34" r="4" fill="url(#g1)"/>
      <path d="M -18 -4 L 18 -4 L 14 22 L -14 22 Z" fill="url(#g1)"/>
      <rect x="-20" y="-8" width="40" height="6" rx="2" fill="url(#g3)"/>
      <ellipse cx="0" cy="-4" rx="16" ry="3" fill="#0A2A66" opacity="0.5"/>
      <path d="M -10 0 L -6 18 L -2 18 L -6 0 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- CINTA METRICA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g transform="rotate(-15)">
      <animateTransform attributeName="transform" type="rotate"
        values="-15; -8; -15" dur="3s" repeatCount="indefinite" additive="replace"/>
      <circle r="14" fill="url(#g1)"/>
      <circle r="8" fill="#0A2A66" opacity="0.6"/>
      <circle r="3" fill="#22C1E0"/>
      <path d="M 14 -6 L 26 -4 L 26 4 L 14 6 Z" fill="url(#g1)"/>
      <g stroke="#ffffff" stroke-width="1.2" opacity="0.8">
        <line x1="16" y1="-3" x2="16" y2="3"/>
        <line x1="19" y1="-3" x2="19" y2="3"/>
        <line x1="22" y1="-3" x2="22" y2="3"/>
      </g>
      <rect x="26" y="-8" width="4" height="16" rx="1.5" fill="url(#g1)"/>
      <ellipse cx="-6" cy="-8" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- BOLSA DE RESIDUOS VERDES (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M -18 -12 L 18 -12 L 20 24 L -20 24 Z" fill="url(#g1)"/>
      <path d="M -18 -12 L -14 -18 L 14 -18 L 18 -12 Z" fill="url(#g3)"/>
      <path d="M -12 -14 Q -16 -22 -12 -26 Q -8 -22 -12 -14 Z" fill="url(#g3)"/>
      <path d="M 0 -16 Q -4 -24 0 -28 Q 4 -24 0 -16 Z" fill="url(#g3)"/>
      <path d="M 12 -14 Q 8 -22 12 -26 Q 16 -22 12 -14 Z" fill="url(#g3)"/>
      <path d="M -14 -12 Q 0 -8 14 -12"
            fill="none" stroke="#0A2A66" stroke-width="2" opacity="0.6"/>
      <path d="M -12 -8 L -8 20 L -4 20 L -8 -8 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- Chispas / particulas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>