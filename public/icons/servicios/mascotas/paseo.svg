<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Paseos de Perro - Contrato Directo">

  <defs>
    <linearGradient id="gradPP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPP" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPerroPP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPP" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPP)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPP)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🐕 PERRO CON CORREA CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el perro camina -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 6 0; 0 0; -6 0; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Cuerpo del perro (perfil, caminando) -->
      <ellipse cx="0" cy="12" rx="38" ry="22" fill="url(#gradPerroPP)"/>

      <!-- Cabeza -->
      <circle cx="-26" cy="-6" r="20" fill="url(#gradPerroPP)"/>

      <!-- Hocico -->
      <ellipse cx="-40" cy="0" rx="10" ry="7" fill="url(#gradPerroPP)"/>
      <!-- Nariz -->
      <ellipse cx="-46" cy="-2" rx="3" ry="2" fill="#0A2A66"/>
      <!-- Boca -->
      <path d="M -44 2 Q -40 6 -36 2" fill="none" stroke="#0A2A66" stroke-width="1.5"/>
      <!-- Lengua -->
      <path d="M -42 4 Q -40 10 -38 4" fill="#22C1E0" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- Orejas -->
      <path d="M -36 -20 L -42 -32 L -28 -24 Z" fill="url(#gradPerroPP)"/>
      <path d="M -16 -20 L -12 -32 L -24 -24 Z" fill="url(#gradPerroPP)"/>

      <!-- Ojo -->
      <circle cx="-30" cy="-10" r="3" fill="#0A2A66"/>
      <circle cx="-29" cy="-11" r="1" fill="#ffffff"/>

      <!-- Collar -->
      <path d="M -22 4 L -10 4" stroke="#22C1E0" stroke-width="4" stroke-linecap="round"/>
      <!-- Chapa del collar -->
      <circle cx="-16" cy="8" r="3" fill="#22C1E0"/>

      <!-- Correa subiendo hacia arriba -->
      <path d="M -16 8 Q 0 -30 20 -50"
            fill="none" stroke="url(#gradPP)" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="6 3">
        <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" repeatCount="indefinite"/>
      </path>

      <!-- Patas (caminando) -->
      <g>
        <!-- Pata trasera izquierda -->
        <rect x="-22" y="28" width="8" height="16" rx="4" fill="url(#gradPerroPP)">
          <animateTransform attributeName="transform" type="rotate"
            values="-10 -18 28; 10 -18 28; -10 -18 28" dur="0.8s" repeatCount="indefinite"/>
        </rect>
        <!-- Pata trasera derecha -->
        <rect x="-10" y="28" width="8" height="16" rx="4" fill="url(#gradPerroPP)">
          <animateTransform attributeName="transform" type="rotate"
            values="10 -6 28; -10 -6 28; 10 -6 28" dur="0.8s" repeatCount="indefinite"/>
        </rect>
        <!-- Pata delantera izquierda -->
        <rect x="10" y="28" width="8" height="16" rx="4" fill="url(#gradPerroPP)">
          <animateTransform attributeName="transform" type="rotate"
            values="-10 14 28; 10 14 28; -10 14 28" dur="0.8s" repeatCount="indefinite"/>
        </rect>
        <!-- Pata delantera derecha -->
        <rect x="22" y="28" width="8" height="16" rx="4" fill="url(#gradPerroPP)">
          <animateTransform attributeName="transform" type="rotate"
            values="10 26 28; -10 26 28; 10 26 28" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Cola animada -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-15 34 6; 15 34 6; -15 34 6" dur="0.7s" repeatCount="indefinite"/>
        <path d="M 34 6 Q 46 0 48 -12" fill="none"
              stroke="url(#gradPerroPP)" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Brillo superior -->
      <ellipse cx="-6" cy="0" rx="14" ry="4" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 👣 PISADAS / HUELLAS (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Huella 1 -->
      <g transform="translate(-14 -6)">
        <ellipse cx="0" cy="4" rx="7" ry="6" fill="url(#gradPP)"/>
        <ellipse cx="-7" cy="-6" rx="3" ry="4" fill="url(#gradPP)"/>
        <ellipse cx="-2" cy="-10" rx="3" ry="4" fill="url(#gradPP)"/>
        <ellipse cx="3" cy="-10" rx="3" ry="4" fill="url(#gradPP)"/>
        <ellipse cx="7" cy="-6" rx="3" ry="4" fill="url(#gradPP)"/>
      </g>
      <!-- Huella 2 (más grande) -->
      <g transform="translate(14 6)">
        <ellipse cx="0" cy="4" rx="8" ry="7" fill="url(#gradPP)"/>
        <ellipse cx="-8" cy="-7" rx="3.5" ry="4.5" fill="url(#gradPP)"/>
        <ellipse cx="-2" cy="-12" rx="3.5" ry="4.5" fill="url(#gradPP)"/>
        <ellipse cx="3" cy="-12" rx="3.5" ry="4.5" fill="url(#gradPP)"/>
        <ellipse cx="8" cy="-7" rx="3.5" ry="4.5" fill="url(#gradPP)"/>
      </g>
    </g>
  </g>

  <!-- 🌳 ÁRBOL / PARQUE (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Tronco -->
      <rect x="-4" y="0" width="8" height="20" fill="url(#gradPP)"/>
      <!-- Copa del árbol -->
      <circle cx="0" cy="-8" r="18" fill="url(#gradPP)"/>
      <circle cx="-12" cy="-2" r="12" fill="url(#gradPP)"/>
      <circle cx="12" cy="-2" r="12" fill="url(#gradPP)"/>
      <!-- Brillo -->
      <ellipse cx="-6" cy="-14" rx="6" ry="3" fill="#ffffff" opacity="0.4"/>
      <!-- Pasto -->
      <path d="M -22 20 L 22 20" stroke="url(#gradPP)" stroke-width="4" stroke-linecap="round"/>
      <path d="M -18 20 L -16 14 M -10 20 L -8 12 M -2 20 L 0 14 M 6 20 L 8 12 M 14 20 L 16 14"
            stroke="url(#gradPP)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 🦮 CORREA / COLLAR (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g transform="rotate(-20)">
      <animateTransform attributeName="transform" type="rotate"
        values="-20; -12; -20" dur="3s" repeatCount="indefinite" additive="replace"/>
      <!-- Correa enrollada -->
      <circle r="20" fill="none" stroke="url(#gradPP)" stroke-width="6"/>
      <circle r="12" fill="none" stroke="url(#gradPP)" stroke-width="6"/>
      <circle r="4" fill="url(#gradPP)"/>
      <!-- Hebilla -->
      <rect x="14" y="-6" width="14" height="12" rx="3" fill="url(#gradPP)"/>
      <rect x="16" y="-4" width="10" height="8" rx="2" fill="#ffffff" opacity="0.3"/>
      <!-- Mosquetón -->
      <circle cx="32" cy="0" r="5" fill="none" stroke="url(#gradPP)" stroke-width="3"/>
      <line x1="34" y1="-3" x2="38" y2="-5" stroke="url(#gradPP)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 🦴 HUESO / PREMIO (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Hueso -->
      <path d="M -22 -4 L 22 -4
               Q 30 -4 30 -10 Q 30 -16 24 -16 Q 22 -16 20 -14
               L 20 4
               Q 22 6 24 6 Q 30 6 30 0 Q 30 -6 22 -6 Z
               M -22 -4 Q -30 -4 -30 -10 Q -30 -16 -24 -16 Q -22 -16 -20 -14
               L -20 4 Q -22 6 -24 6 Q -30 6 -30 0 Q -30 -6 -22 -6 Z"
            fill="url(#gradPP)"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="10" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ☀️ SOL / CLIMA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      <!-- Rayos -->
      <g stroke="url(#gradPP)" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-22" x2="0" y2="-16"/>
        <line x1="0" y1="16" x2="0" y2="22"/>
        <line x1="-22" y1="0" x2="-16" y2="0"/>
        <line x1="16" y1="0" x2="22" y2="0"/>
        <line x1="-15" y1="-15" x2="-11" y2="-11"/>
        <line x1="11" y1="-11" x2="15" y2="-15"/>
        <line x1="-11" y1="11" x2="-15" y2="15"/>
        <line x1="11" y1="11" x2="15" y2="15"/>
      </g>
      <!-- Círculo central -->
      <circle r="12" fill="url(#gradPP)"/>
      <circle r="6" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 📍 RUTA / UBICACIÓN (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Pin de ubicación -->
      <path d="M 0 -22 Q -16 -22 -16 -8 Q -16 4 0 22 Q 16 4 16 -8 Q 16 -22 0 -22 Z"
            fill="url(#gradPP)"/>
      <!-- Círculo interior -->
      <circle cx="0" cy="-8" r="6" fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="-8" r="3" fill="#22C1E0"/>
      <!-- Línea de ruta (camino) -->
      <path d="M -20 20 Q -10 16 0 20 Q 10 24 20 20"
            fill="none" stroke="url(#gradPP)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="3 3"/>
      <!-- Puntos de la ruta -->
      <circle cx="-20" cy="20" r="2" fill="#22C1E0"/>
      <circle cx="0" cy="20" r="2" fill="#22C1E0"/>
      <circle cx="20" cy="20" r="2" fill="#22C1E0"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>