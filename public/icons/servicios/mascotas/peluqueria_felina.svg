<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Peluquería Felina - Contrato Directo">

  <defs>
    <linearGradient id="gradPF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPF" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradTijerasF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPF" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPF)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPF)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ✂️ TIJERAS CENTRALES (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g transform="rotate(-30)">
      <animateTransform attributeName="transform" type="rotate"
        values="-30; -24; -30" dur="2.4s" repeatCount="indefinite"/>

      <!-- Hoja superior -->
      <path d="M -6 -50 L 4 -50 L 2 -6 L -4 -6 Z" fill="url(#gradTijerasF)"/>
      <path d="M -6 -50 L 4 -50 L 2 -56 L -4 -56 Z" fill="url(#gradTijerasF)"/>
      <!-- Hoja inferior -->
      <path d="M -4 6 L 2 6 L 4 50 L -6 50 Z" fill="url(#gradTijerasF)"/>
      <path d="M -6 56 L 4 56 L 2 50 L -4 50 Z" fill="url(#gradTijerasF)"/>

      <!-- Perno central -->
      <circle r="5" fill="url(#gradPF)"/>
      <circle r="2" fill="#ffffff" opacity="0.9"/>

      <!-- Anillo superior (mango) -->
      <circle cx="-14" cy="-62" r="10" fill="none"
              stroke="url(#gradPF)" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate"
          values="-3 -14 -62; 3 -14 -62; -3 -14 -62" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Anillo inferior (mango) -->
      <circle cx="14" cy="62" r="10" fill="none"
              stroke="url(#gradPF)" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate"
          values="3 14 62; -3 14 62; 3 14 62" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Pelos cayendo -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="20" y1="-10" x2="30" y2="-18">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="0" x2="36" y2="-4">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="22" y1="12" x2="34" y2="14">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.7s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- 🐈 GATO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>

      <!-- Cuerpo del gato -->
      <ellipse cx="0" cy="4" rx="26" ry="18" fill="url(#gradPF)"/>

      <!-- Cabeza -->
      <circle cx="-18" cy="-14" r="14" fill="url(#gradPF)"/>

      <!-- Orejas puntiagudas -->
      <path d="M -28 -22 L -32 -34 L -22 -26 Z" fill="url(#gradPF)"/>
      <path d="M -12 -22 L -8 -34 L -18 -26 Z" fill="url(#gradPF)"/>
      <!-- Interior de las orejas -->
      <path d="M -27 -24 L -29 -31 L -23 -26 Z" fill="#22C1E0" opacity="0.6"/>
      <path d="M -13 -24 L -11 -31 L -17 -26 Z" fill="#22C1E0" opacity="0.6"/>

      <!-- Hocico -->
      <ellipse cx="-22" cy="-8" rx="7" ry="5" fill="url(#gradPF)"/>
      <!-- Nariz -->
      <path d="M -24 -10 L -20 -10 L -22 -8 Z" fill="#0A2A66"/>
      <!-- Boca -->
      <path d="M -22 -8 Q -24 -6 -26 -7 M -22 -8 Q -20 -6 -18 -7"
            fill="none" stroke="#0A2A66" stroke-width="1" stroke-linecap="round"/>

      <!-- Bigotes -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.8">
        <line x1="-30" y1="-8" x2="-38" y2="-10"/>
        <line x1="-30" y1="-6" x2="-38" y2="-4"/>
        <line x1="-14" y1="-8" x2="-6" y2="-10"/>
        <line x1="-14" y1="-6" x2="-6" y2="-4"/>
      </g>

      <!-- Ojos grandes (típicos del gato) -->
      <ellipse cx="-24" cy="-16" rx="3" ry="3.5" fill="#0A2A66"/>
      <circle cx="-24" cy="-16" r="1" fill="#ffffff"/>
      <ellipse cx="-12" cy="-16" rx="3" ry="3.5" fill="#0A2A66"/>
      <circle cx="-12" cy="-16" r="1" fill="#ffffff"/>

      <!-- Rayas del gato atigrado -->
      <g stroke="#0A2A66" stroke-width="1.5" opacity="0.4">
        <path d="M -2 -6 Q 4 -8 8 -4" fill="none"/>
        <path d="M -2 2 Q 6 0 10 4" fill="none"/>
        <path d="M 0 10 Q 8 10 12 14" fill="none"/>
      </g>

      <!-- Patas delanteras -->
      <rect x="-14" y="16" width="7" height="10" rx="3.5" fill="url(#gradPF)"/>
      <rect x="-4" y="16" width="7" height="10" rx="3.5" fill="url(#gradPF)"/>

      <!-- Cola curvada (típica del gato) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-8 22 -2; 8 22 -2; -8 22 -2" dur="1.6s" repeatCount="indefinite"/>
        <path d="M 22 -2 Q 32 -4 34 -14 Q 34 -20 30 -22"
              fill="none" stroke="url(#gradPF)" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Moño en la cabeza (guño a la peluquería) -->
      <path d="M -14 -28 Q -8 -34 -4 -28 Q -8 -24 -14 -28 Z" fill="#22C1E0"/>
      <path d="M -14 -28 Q -20 -34 -24 -28 Q -20 -24 -14 -28 Z" fill="#22C1E0"/>
      <circle cx="-14" cy="-28" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- 🧴 SHAMPOO / BAÑO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <rect x="-14" y="-16" width="28" height="38" rx="5" fill="url(#gradPF)"/>
      <rect x="-8" y="-22" width="16" height="8" rx="2" fill="url(#gradPF)"/>
      <rect x="-3" y="-28" width="6" height="8" rx="2" fill="url(#gradPF)"/>
      <rect x="-10" y="-8" width="20" height="18" rx="2" fill="#ffffff" opacity="0.95"/>
      <!-- Huella de gato en la etiqueta -->
      <g fill="url(#gradPF)">
        <ellipse cx="0" cy="2" rx="3.5" ry="3"/>
        <ellipse cx="-3" cy="-2" rx="1.5" ry="2"/>
        <ellipse cx="0" cy="-4" rx="1.5" ry="2"/>
        <ellipse cx="3" cy="-2" rx="1.5" ry="2"/>
      </g>
      <!-- Burbujas -->
      <g fill="#ffffff" opacity="0.85">
        <circle cx="-18" cy="-16" r="3">
          <animate attributeName="cy" values="-16;-24;-16" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="18" cy="-12" r="2">
          <animate attributeName="cy" values="-12;-22;-12" dur="2s" begin="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.85;0.2;0.85" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="-11" y="-12" width="3" height="30" rx="1.5" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🪮 CEPILLO / CARDA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g transform="rotate(-25)">
      <animateTransform attributeName="transform" type="rotate"
        values="-25; -18; -25" dur="3s" repeatCount="indefinite" additive="replace"/>
      <rect x="-4" y="-38" width="8" height="50" rx="4" fill="url(#gradPF)"/>
      <rect x="-18" y="12" width="36" height="20" rx="4" fill="url(#gradPF)"/>
      <!-- Cerdas -->
      <g stroke="url(#gradPF)" stroke-width="2" stroke-linecap="round">
        <line x1="-14" y1="32" x2="-14" y2="42"/>
        <line x1="-8" y1="32" x2="-8" y2="42"/>
        <line x1="-2" y1="32" x2="-2" y2="42"/>
        <line x1="4" y1="32" x2="4" y2="42"/>
        <line x1="10" y1="32" x2="10" y2="42"/>
        <line x1="14" y1="32" x2="14" y2="42"/>
      </g>
      <rect x="-14" y="14" width="28" height="3" rx="1.5" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 💨 SECADOR / SOPLO (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <rect x="-16" y="-14" width="32" height="24" rx="6" fill="url(#gradPF)"/>
      <rect x="-6" y="10" width="12" height="20" rx="4" fill="url(#gradPF)"/>
      <rect x="16" y="-8" width="12" height="12" rx="2" fill="url(#gradPF)"/>
      <line x1="20" y1="-6" x2="20" y2="2" stroke="#0A2A66" stroke-width="1"/>
      <line x1="24" y1="-6" x2="24" y2="2" stroke="#0A2A66" stroke-width="1"/>
      <!-- Aire saliendo -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
        <path d="M 30 -6 Q 38 -8 42 -12">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M 30 0 Q 40 0 44 -2">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
        </path>
        <path d="M 30 6 Q 38 8 42 12">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle cx="-8" cy="-2" r="2" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-13" y="-12" width="26" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🎀 MOÑO / ACCESORIO (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M 0 0 Q -18 -14 -20 0 Q -18 14 0 0 Z" fill="url(#gradPF)"/>
      <path d="M 0 0 Q 18 -14 20 0 Q 18 14 0 0 Z" fill="url(#gradPF)"/>
      <circle r="5" fill="url(#gradPF)"/>
      <circle r="2" fill="#22C1E0"/>
      <path d="M -3 4 Q -6 14 -2 22" fill="none" stroke="url(#gradPF)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 3 4 Q 6 14 2 22" fill="none" stroke="url(#gradPF)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-8" cy="-4" rx="4" ry="2" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- 🛁 BAÑERA / TINA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <path d="M -22 -10 L 22 -10 L 20 14 Q 20 20 14 20 L -14 20 Q -20 20 -20 14 Z"
            fill="url(#gradPF)"/>
      <rect x="-24" y="-14" width="48" height="6" rx="2" fill="url(#gradPF)"/>
      <rect x="-18" y="20" width="4" height="6" fill="url(#gradPF)"/>
      <rect x="14" y="20" width="4" height="6" fill="url(#gradPF)"/>
      <ellipse cx="0" cy="-8" rx="20" ry="4" fill="#22C1E0" opacity="0.85"/>
      <!-- Espuma -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="-12" cy="-10" r="4"/>
        <circle cx="-4" cy="-12" r="5"/>
        <circle cx="6" cy="-10" r="4"/>
        <circle cx="14" cy="-11" r="3.5"/>
        <circle cx="-8" cy="-16" r="3"/>
        <circle cx="2" cy="-17" r="3"/>
      </g>
      <rect x="-3" y="-22" width="6" height="10" rx="2" fill="url(#gradPF)"/>
      <path d="M -3 -22 Q -3 -28 2 -28 L 8 -28 Q 12 -28 12 -24 L 12 -20 L 6 -20 L 6 -24 Q 6 -24 6 -24 L 2 -24 Q 2 -22 -3 -22 Z"
            fill="url(#gradPF)"/>
      <circle cx="8" cy="-16" r="1.5" fill="#22C1E0">
        <animate attributeName="cy" values="-18;-8;-18" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M -18 12 L -14 16 L -8 16 L -14 12 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>