<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Adiestramiento de Animales - Contrato Directo">

  <defs>
    <linearGradient id="gradAD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroAD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPerro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowAD" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroAD)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowAD)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🐕 PERRO CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el perro mueve la cola -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="2.5s" repeatCount="indefinite"/>

      <!-- Cuerpo del perro -->
      <ellipse cx="0" cy="12" rx="36" ry="22" fill="url(#gradPerro)"/>

      <!-- Cabeza -->
      <circle cx="-24" cy="-8" r="20" fill="url(#gradPerro)"/>

      <!-- Hocico -->
      <ellipse cx="-38" cy="-2" rx="10" ry="7" fill="url(#gradPerro)"/>
      <!-- Nariz -->
      <ellipse cx="-44" cy="-4" rx="3" ry="2" fill="#0A2A66"/>
      <!-- Boca -->
      <path d="M -42 0 Q -38 4 -34 0" fill="none" stroke="#0A2A66" stroke-width="1.5"/>

      <!-- Orejas -->
      <path d="M -34 -22 L -40 -34 L -26 -26 Z" fill="url(#gradPerro)"/>
      <path d="M -14 -22 L -10 -34 L -22 -26 Z" fill="url(#gradPerro)"/>

      <!-- Ojo -->
      <circle cx="-28" cy="-12" r="3" fill="#0A2A66"/>
      <circle cx="-27" cy="-13" r="1" fill="#ffffff"/>

      <!-- Collar -->
      <path d="M -20 2 L -10 2" stroke="#22C1E0" stroke-width="4" stroke-linecap="round"/>
      <!-- Chapa del collar -->
      <circle cx="-15" cy="6" r="3" fill="#22C1E0"/>

      <!-- Patas -->
      <rect x="-20" y="28" width="8" height="16" rx="4" fill="url(#gradPerro)"/>
      <rect x="-8" y="28" width="8" height="16" rx="4" fill="url(#gradPerro)"/>
      <rect x="8" y="28" width="8" height="16" rx="4" fill="url(#gradPerro)"/>
      <rect x="20" y="28" width="8" height="16" rx="4" fill="url(#gradPerro)"/>

      <!-- Cola animada -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-15 32 8; 15 32 8; -15 32 8" dur="0.8s" repeatCount="indefinite"/>
        <path d="M 32 8 Q 44 4 46 -8" fill="none"
              stroke="url(#gradPerro)" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Brillo superior -->
      <ellipse cx="-6" cy="-2" rx="14" ry="4" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🦴 HUESO / PREMIO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Hueso -->
      <path d="M -22 -4 L 22 -4
               Q 30 -4 30 -10 Q 30 -16 24 -16 Q 22 -16 20 -14
               L 20 4
               Q 22 6 24 6 Q 30 6 30 0 Q 30 -6 22 -6 Z
               M -22 -4 Q -30 -4 -30 -10 Q -30 -16 -24 -16 Q -22 -16 -20 -14
               L -20 4 Q -22 6 -24 6 Q -30 6 -30 0 Q -30 -6 -22 -6 Z"
            fill="url(#gradAD)"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="10" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 👨‍🏫 ADIESTRADOR (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-18" r="12" fill="url(#gradAD)"/>
      <!-- Gorra -->
      <path d="M -12 -22 Q -12 -30 0 -30 Q 12 -30 12 -22 Z" fill="url(#gradAD)"/>
      <rect x="-12" y="-22" width="24" height="3" rx="1.5" fill="url(#gradAD)"/>
      <!-- Cuerpo -->
      <path d="M -12 -4 Q -14 -12 0 -14 Q 14 -12 12 -4 L 12 18 L -12 18 Z"
            fill="url(#gradAD)"/>
      <!-- Brazo derecho señalando (arriba) -->
      <path d="M 12 -8 L 24 -18 L 26 -14 L 14 -4 Z" fill="url(#gradAD)"/>
      <!-- Mano / dedo -->
      <circle cx="26" cy="-16" r="3" fill="url(#gradAD)"/>
      <!-- Brazo izquierdo sosteniendo premio -->
      <path d="M -12 -8 L -22 0 L -20 4 L -10 -4 Z" fill="url(#gradAD)"/>
      <!-- Detalles del uniforme -->
      <rect x="-8" y="0" width="16" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
      <rect x="-8" y="6" width="16" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
      <!-- Cara -->
      <circle cx="-3" cy="-18" r="1.5" fill="#0A2A66"/>
      <circle cx="3" cy="-18" r="1.5" fill="#0A2A66"/>
    </g>
  </g>

  <!-- 🎯 OBJETIVO / DIANA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.05 1.05; 1 1" dur="2.4s" repeatCount="indefinite"/>
      <!-- Diana exterior -->
      <circle r="22" fill="url(#gradAD)"/>
      <circle r="16" fill="#ffffff" opacity="0.9"/>
      <circle r="10" fill="url(#gradAD)"/>
      <circle r="5" fill="#22C1E0"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="4" ry="2" fill="#ffffff" opacity="0.5"/>
      <!-- Flecha acertando -->
      <line x1="-24" y1="24" x2="-4" y2="4" stroke="#22C1E0"
            stroke-width="3" stroke-linecap="round"/>
      <path d="M -4 4 L 0 0 L 4 4" fill="none" stroke="#22C1E0"
            stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 🎾 PELOTA / JUGUETE (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 -3; 0 0" dur="2s" repeatCount="indefinite"/>
      <!-- Pelota -->
      <circle r="20" fill="url(#gradAD)"/>
      <!-- Líneas de la pelota de tenis -->
      <path d="M -14 -10 Q 0 -4 14 -10" fill="none"
            stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <path d="M -14 10 Q 0 4 14 10" fill="none"
            stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="4" ry="3" fill="#ffffff" opacity="0.5"/>
      <!-- Movimiento (líneas de velocidad) -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <line x1="-26" y1="-8" x2="-30" y2="-10"/>
        <line x1="-26" y1="0" x2="-32" y2="0"/>
        <line x1="-26" y1="8" x2="-30" y2="10"/>
      </g>
    </g>
  </g>

  <!-- 🐾 HUELLA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Almohadilla principal -->
      <ellipse cx="0" cy="6" rx="12" ry="10" fill="url(#gradAD)"/>
      <!-- Dedos -->
      <ellipse cx="-12" cy="-10" rx="5" ry="6" fill="url(#gradAD)"/>
      <ellipse cx="-4" cy="-16" rx="5" ry="6" fill="url(#gradAD)"/>
      <ellipse cx="4" cy="-16" rx="5" ry="6" fill="url(#gradAD)"/>
      <ellipse cx="12" cy="-10" rx="5" ry="6" fill="url(#gradAD)"/>
      <!-- Brillo -->
      <ellipse cx="-4" cy="2" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🏆 TROFEO / LOGRO (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Copa del trofeo -->
      <path d="M -14 -18 L 14 -18 L 12 0 Q 12 10 0 12 Q -12 10 -12 0 Z"
            fill="url(#gradAD)"/>
      <!-- Asas -->
      <path d="M -14 -14 Q -22 -14 -22 -6 Q -22 0 -14 0"
            fill="none" stroke="url(#gradAD)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 14 -14 Q 22 -14 22 -6 Q 22 0 14 0"
            fill="none" stroke="url(#gradAD)" stroke-width="4" stroke-linecap="round"/>
      <!-- Base del trofeo -->
      <rect x="-16" y="12" width="32" height="6" rx="2" fill="url(#gradAD)"/>
      <rect x="-12" y="18" width="24" height="6" rx="2" fill="url(#gradAD)"/>
      <!-- Estrella dentro -->
      <path d="M 0 -12 L 3 -6 L 9 -6 L 4 -2 L 6 4 L 0 0 L -6 4 L -4 -2 L -9 -6 L -3 -6 Z"
            fill="#ffffff" opacity="0.9"/>
      <!-- Brillo -->
      <path d="M -10 -16 L 10 -16 L 8 -18 L -8 -18 Z" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>