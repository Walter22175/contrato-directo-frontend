<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Pet Sister - Contrato Directo">

  <defs>
    <linearGradient id="gradPS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPS" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradHuellaPS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPS" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPS)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPS)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🐾 HUELLA DE MASCOTA CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: la huella late como un corazón -->
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.04 1.04; 1 1" dur="1.8s" repeatCount="indefinite"/>

      <!-- Almohadilla principal -->
      <ellipse cx="0" cy="14" rx="34" ry="26" fill="url(#gradHuellaPS)"/>

      <!-- Dedos (4) -->
      <ellipse cx="-26" cy="-14" rx="13" ry="16" fill="url(#gradHuellaPS)"/>
      <ellipse cx="-9" cy="-26" rx="13" ry="16" fill="url(#gradHuellaPS)"/>
      <ellipse cx="9" cy="-26" rx="13" ry="16" fill="url(#gradHuellaPS)"/>
      <ellipse cx="26" cy="-14" rx="13" ry="16" fill="url(#gradHuellaPS)"/>

      <!-- Corazón dentro de la almohadilla -->
      <path d="M 0 22
               Q -8 14 -14 18
               Q -20 22 -14 28
               Q -8 34 0 40
               Q 8 34 14 28
               Q 20 22 14 18
               Q 8 14 0 22 Z"
            fill="#ffffff" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.6;0.95" dur="1.8s" repeatCount="indefinite"/>
      </path>

      <!-- Brillo superior -->
      <ellipse cx="-12" cy="-18" rx="6" ry="3" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🏠 CASA / DOMICILIO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Techo -->
      <path d="M -24 -4 L 0 -24 L 24 -4 Z" fill="url(#gradPS)"/>
      <!-- Cuerpo -->
      <rect x="-18" y="-4" width="36" height="24" rx="2" fill="url(#gradPS)"/>
      <!-- Puerta -->
      <rect x="-6" y="6" width="12" height="14" rx="2" fill="#0A2A66" opacity="0.7"/>
      <!-- Ventana -->
      <rect x="8" y="2" width="6" height="6" rx="1" fill="#22C1E0" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- Manija -->
      <circle cx="3" cy="13" r="1" fill="#22C1E0"/>
      <!-- Brillo -->
      <path d="M -18 -4 L 18 -4 L 16 -2 L -16 -2 Z" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- ❤️ CORAZÓN / CARIÑO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.08 1.08; 1 1" dur="1.4s" repeatCount="indefinite"/>
      <!-- Corazón -->
      <path d="M 0 -14
               Q -12 -26 -22 -16
               Q -30 -6 -22 4
               Q -12 16 0 26
               Q 12 16 22 4
               Q 30 -6 22 -16
               Q 12 -26 0 -14 Z"
            fill="url(#gradPS)"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="4" ry="2" fill="#ffffff" opacity="0.5"/>
      <!-- Corazoncito dentro -->
      <path d="M 0 -4 Q -4 -8 -7 -5 Q -10 -1 -7 3 Q -3 7 0 10 Q 3 7 7 3 Q 10 -1 7 -5 Q 4 -8 0 -4 Z"
            fill="#ffffff" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 🍽️ COMIDA / BEBEDERO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Plato de comida -->
      <ellipse cx="0" cy="10" rx="22" ry="8" fill="url(#gradPS)"/>
      <path d="M -22 10 Q -22 18 -14 20 L 14 20 Q 22 18 22 10 Z" fill="url(#gradPS)"/>
      <!-- Comida (croquetas) -->
      <ellipse cx="0" cy="10" rx="18" ry="5" fill="#22C1E0" opacity="0.85"/>
      <circle cx="-8" cy="8" r="2" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="7" r="2" fill="#ffffff" opacity="0.9"/>
      <circle cx="8" cy="8" r="2" fill="#ffffff" opacity="0.9"/>
      <!-- Tazón de agua al lado -->
      <ellipse cx="24" cy="14" rx="10" ry="4" fill="url(#gradPS)"/>
      <path d="M 14 14 Q 14 20 18 22 L 30 22 Q 34 20 34 14 Z" fill="url(#gradPS)"/>
      <ellipse cx="24" cy="14" rx="8" ry="3" fill="#22C1E0" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Brillo -->
      <ellipse cx="-8" cy="12" rx="6" ry="2" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🎾 JUGUETE / PELOTA (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 -3; 0 0" dur="2s" repeatCount="indefinite"/>
      <!-- Pelota -->
      <circle r="22" fill="url(#gradPS)"/>
      <!-- Líneas de la pelota de tenis -->
      <path d="M -16 -12 Q 0 -4 16 -12" fill="none"
            stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <path d="M -16 12 Q 0 4 16 12" fill="none"
            stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="5" ry="3" fill="#ffffff" opacity="0.5"/>
      <!-- Movimiento (líneas de velocidad) -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <line x1="-28" y1="-8" x2="-34" y2="-10"/>
        <line x1="-28" y1="0" x2="-36" y2="0"/>
        <line x1="-28" y1="8" x2="-34" y2="10"/>
      </g>
    </g>
  </g>

  <!-- 📅 AGENDA / HORARIO (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo de la agenda -->
      <rect x="-18" y="-18" width="36" height="40" rx="4" fill="url(#gradPS)"/>
      <!-- Anillos superiores -->
      <circle cx="-10" cy="-20" r="2.5" fill="url(#gradPS)"/>
      <circle cx="0" cy="-20" r="2.5" fill="url(#gradPS)"/>
      <circle cx="10" cy="-20" r="2.5" fill="url(#gradPS)"/>
      <!-- Página blanca -->
      <rect x="-14" y="-12" width="28" height="30" rx="2" fill="#ffffff" opacity="0.95"/>
      <!-- Fecha / día -->
      <rect x="-10" y="-8" width="20" height="6" rx="1" fill="#0A2A66"/>
      <!-- Líneas de tareas -->
      <rect x="-10" y="2" width="14" height="2" rx="1" fill="#0A2A66" opacity="0.6"/>
      <rect x="-10" y="7" width="18" height="2" rx="1" fill="#0A2A66" opacity="0.6"/>
      <rect x="-10" y="12" width="12" height="2" rx="1" fill="#0A2A66" opacity="0.6"/>
      <!-- Check de tarea completada -->
      <circle cx="8" cy="3" r="2" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="8" r="2" fill="#22C1E0" opacity="0.5"/>
      <circle cx="8" cy="13" r="2" fill="#22C1E0" opacity="0.5"/>
    </g>
  </g>

  <!-- 📱 APP / REPORTE (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Celular -->
      <rect x="-12" y="-22" width="24" height="44" rx="4" fill="url(#gradPS)"/>
      <!-- Pantalla -->
      <rect x="-9" y="-18" width="18" height="36" rx="2" fill="#0A2A66" opacity="0.9"/>
      <!-- Foto de la mascota en pantalla -->
      <circle cx="0" cy="-8" r="6" fill="#22C1E0"/>
      <circle cx="-3" cy="-9" r="1" fill="#0A2A66"/>
      <circle cx="3" cy="-9" r="1" fill="#0A2A66"/>
      <ellipse cx="0" cy="-5" rx="2" ry="1" fill="#0A2A66"/>
      <!-- Líneas de reporte -->
      <rect x="-6" y="2" width="12" height="2" rx="1" fill="#22C1E0" opacity="0.8"/>
      <rect x="-6" y="6" width="8" height="2" rx="1" fill="#22C1E0" opacity="0.6"/>
      <!-- Check de confirmación -->
      <circle cx="0" cy="12" r="3" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Notificación -->
      <circle cx="9" cy="-16" r="2.5" fill="#22C1E0">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (huellas pequeñas) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>