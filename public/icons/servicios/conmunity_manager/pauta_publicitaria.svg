<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Pauta Publicitaria - Contrato Directo">

  <defs>
    <linearGradient id="gradPPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPPA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradDianaPPA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPPA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPPA)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPPA)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🎯 DIANA / TARGET CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: la diana pulsa -->
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.03 1.03; 1 1" dur="2s" repeatCount="indefinite"/>

      <!-- Aro exterior -->
      <circle r="52" fill="url(#gradDianaPPA)"/>
      <circle r="40" fill="#ffffff" opacity="0.95"/>
      <circle r="28" fill="url(#gradDianaPPA)"/>
      <circle r="16" fill="#ffffff" opacity="0.95"/>
      <!-- Centro -->
      <circle r="8" fill="#22C1E0">
        <animate attributeName="r" values="8;10;8" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Cruz de mira -->
      <g stroke="#0A2A66" stroke-width="2" opacity="0.6">
        <line x1="0" y1="-58" x2="0" y2="-48"/>
        <line x1="0" y1="48" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="-48" y2="0"/>
        <line x1="48" y1="0" x2="58" y2="0"/>
      </g>

      <!-- Brillo -->
      <ellipse cx="-18" cy="-22" rx="12" ry="5" fill="#ffffff" opacity="0.4"/>

      <!-- Pulso expansivo -->
      <circle r="52" fill="none" stroke="#22C1E0" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="50;64;50" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 💰 PRESUPUESTO / MONEDA (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Moneda principal -->
      <circle r="20" fill="url(#gradPPA)"/>
      <circle r="15" fill="#0A2A66" opacity="0.6"/>
      <!-- Símbolo $ -->
      <path d="M 0 -10 L 0 10 M -5 -6 Q -8 -6 -8 -3 Q -8 0 -4 0 L 4 0 Q 8 0 8 3 Q 8 6 5 6 L -5 6"
            fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Brillo -->
      <ellipse cx="-6" cy="-8" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
      <!-- Monedas secundarias -->
      <circle cx="-20" cy="14" r="6" fill="url(#gradPPA)" opacity="0.8"/>
      <circle cx="20" cy="14" r="6" fill="url(#gradPPA)" opacity="0.8"/>
    </g>
  </g>

  <!-- 📢 MEGÁFONO / ANUNCIO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g transform="rotate(-15)">
      <animateTransform attributeName="transform" type="rotate"
        values="-15; -8; -15" dur="2.8s" repeatCount="indefinite" additive="replace"/>
      <!-- Cuerpo del megáfono -->
      <path d="M -22 -8 L 10 -20 L 10 12 L -22 0 Z" fill="url(#gradPPA)"/>
      <!-- Mango -->
      <rect x="-10" y="0" width="8" height="16" rx="2" fill="url(#gradPPA)"/>
      <!-- Bocina / salida -->
      <ellipse cx="-22" cy="-4" rx="4" ry="12" fill="#0A2A66" opacity="0.7"/>
      <!-- Ondas de sonido -->
      <g stroke="#22C1E0" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M 14 -12 Q 20 -6 14 0">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 20 -18 Q 30 -6 20 6">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
        </path>
        <path d="M 26 -24 Q 40 -6 26 12">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- Brillo -->
      <path d="M -18 -6 L 6 -16 L 6 -14 L -18 -4 Z" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 👥 AUDIENCIA / PÚBLICO OBJETIVO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Persona central (destacada) -->
      <circle cx="0" cy="-12" r="9" fill="url(#gradPPA)"/>
      <path d="M -12 14 Q -12 0 0 0 Q 12 0 12 14 Z" fill="url(#gradPPA)"/>
      <!-- Persona izquierda (detrás) -->
      <circle cx="-18" cy="-8" r="7" fill="url(#gradPPA)" opacity="0.6"/>
      <path d="M -28 14 Q -28 2 -18 2 Q -8 2 -8 14 Z" fill="url(#gradPPA)" opacity="0.6"/>
      <!-- Persona derecha (detrás) -->
      <circle cx="18" cy="-8" r="7" fill="url(#gradPPA)" opacity="0.6"/>
      <path d="M 8 14 Q 8 2 18 2 Q 28 2 28 14 Z" fill="url(#gradPPA)" opacity="0.6"/>
      <!-- Brillo -->
      <ellipse cx="-3" cy="-14" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
      <!-- Foco / marcado -->
      <circle cx="0" cy="-12" r="14" fill="none"
              stroke="#22C1E0" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📈 ROI / MÉTRICAS (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Panel de fondo -->
      <rect x="-24" y="-20" width="48" height="40" rx="4" fill="url(#gradPPA)"/>
      <!-- Pantalla interior -->
      <rect x="-20" y="-16" width="40" height="32" rx="2" fill="#0A2A66" opacity="0.9"/>
      <!-- Gráfico de línea ascendente -->
      <path d="M -16 10 L -8 2 L -2 6 L 6 -6 L 16 -12"
            fill="none" stroke="#22C1E0" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 100;60 0" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <!-- Puntos de la línea -->
      <circle cx="-8" cy="2" r="1.5" fill="#ffffff"/>
      <circle cx="6" cy="-6" r="1.5" fill="#ffffff"/>
      <circle cx="16" cy="-12" r="2" fill="#22C1E0">
        <animate attributeName="r" values="2;3.5;2" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Flecha hacia arriba -->
      <path d="M 12 -14 L 18 -14 L 18 -8 Z" fill="#22C1E0"/>
    </g>
  </g>

  <!-- 📱 CANALES / PLATAFORMAS (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Celular -->
      <rect x="-14" y="-22" width="28" height="44" rx="4" fill="url(#gradPPA)"/>
      <!-- Pantalla -->
      <rect x="-11" y="-18" width="22" height="36" rx="2" fill="#0A2A66" opacity="0.9"/>
      <!-- Iconos de canales -->
      <g fill="#22C1E0">
        <rect x="-8" y="-14" width="6" height="6" rx="1"/>
        <rect x="2" y="-14" width="6" height="6" rx="1" opacity="0.7"/>
        <rect x="-8" y="-6" width="6" height="6" rx="1" opacity="0.7"/>
        <rect x="2" y="-6" width="6" height="6" rx="1"/>
        <rect x="-8" y="2" width="6" height="6" rx="1" opacity="0.5"/>
        <rect x="2" y="2" width="6" height="6" rx="1" opacity="0.7"/>
      </g>
      <circle cx="0" cy="18" r="1.5" fill="#22C1E0"/>
      <!-- Notificación -->
      <circle cx="10" cy="-18" r="3.5" fill="#22C1E0">
        <animate attributeName="r" values="3.5;5;3.5" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 🖱️ CLIC / CONVERSIÓN (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.08 1.08; 1 1" dur="1.4s" repeatCount="indefinite"/>
      <!-- Círculo de fondo -->
      <circle r="22" fill="url(#gradPPA)"/>
      <!-- Cursor de mano / clic -->
      <path d="M -6 -12 L -6 8 L -2 4 L 2 12 L 6 10 L 2 2 L 8 2 Z"
            fill="#ffffff"/>
      <!-- Ondas de clic -->
      <circle r="22" fill="none" stroke="#22C1E0" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>