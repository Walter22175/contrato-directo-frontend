<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Análisis e Informes - Contrato Directo">

  <defs>
    <linearGradient id="gradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroAI" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradBarra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroAI)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowAI)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 📊 GRÁFICO DE BARRAS CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: las barras crecen y decrecen -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -2; 0 0" dur="3s" repeatCount="indefinite"/>

      <!-- Eje horizontal -->
      <line x1="-52" y1="42" x2="52" y2="42" stroke="url(#gradAI)" stroke-width="4" stroke-linecap="round"/>
      <!-- Eje vertical -->
      <line x1="-52" y1="42" x2="-52" y2="-42" stroke="url(#gradAI)" stroke-width="4" stroke-linecap="round"/>

      <!-- Barra 1 -->
      <rect x="-46" y="10" width="16" height="32" rx="3" fill="url(#gradBarra)">
        <animate attributeName="height" values="32;44;32" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;-2;10" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Barra 2 -->
      <rect x="-24" y="-8" width="16" height="50" rx="3" fill="url(#gradBarra)">
        <animate attributeName="height" values="50;34;50" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-8;8;-8" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Barra 3 -->
      <rect x="-2" y="-22" width="16" height="64" rx="3" fill="url(#gradBarra)">
        <animate attributeName="height" values="64;48;64" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-22;-6;-22" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <!-- Barra 4 -->
      <rect x="20" y="-14" width="16" height="56" rx="3" fill="url(#gradBarra)">
        <animate attributeName="height" values="56;68;56" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-14;-26;-14" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
      </rect>

      <!-- Línea de tendencia superior (por encima de las barras) -->
      <path d="M -38 0 Q -16 -14 6 -24 Q 18 -30 28 -32"
            fill="none" stroke="#22C1E0" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="4 3">
        <animate attributeName="stroke-dashoffset" values="0;-14" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Puntos de la tendencia -->
      <circle cx="-38" cy="0" r="3" fill="#ffffff"/>
      <circle cx="6" cy="-24" r="3" fill="#ffffff"/>
      <circle cx="28" cy="-32" r="3" fill="#22C1E0">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Brillo superior -->
      <rect x="-48" y="-42" width="96" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 📈 LÍNEA DE TENDENCIA (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Panel de fondo -->
      <rect x="-24" y="-18" width="48" height="36" rx="4" fill="url(#gradAI)"/>
      <!-- Grilla -->
      <g stroke="#0A2A66" stroke-width="0.5" opacity="0.4">
        <line x1="-20" y1="-10" x2="20" y2="-10"/>
        <line x1="-20" y1="0" x2="20" y2="0"/>
        <line x1="-20" y1="10" x2="20" y2="10"/>
      </g>
      <!-- Línea de tendencia subiendo -->
      <path d="M -20 12 L -10 4 L -2 8 L 8 -6 L 20 -12"
            fill="none" stroke="#22C1E0" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 80;80 0" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <!-- Puntos de la línea -->
      <circle cx="-10" cy="4" r="1.8" fill="#ffffff"/>
      <circle cx="8" cy="-6" r="1.8" fill="#ffffff"/>
      <circle cx="20" cy="-12" r="2.2" fill="#22C1E0">
        <animate attributeName="r" values="2.2;3.5;2.2" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📋 INFORME / DOCUMENTO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Carpeta / informe -->
      <rect x="-22" y="-22" width="44" height="44" rx="4" fill="url(#gradAI)"/>
      <!-- Pestaña superior -->
      <rect x="-14" y="-26" width="18" height="6" rx="2" fill="url(#gradAI)"/>
      <!-- Hoja de papel asomando -->
      <rect x="-18" y="-18" width="36" height="36" rx="2" fill="#ffffff" opacity="0.95"/>
      <!-- Gráfico dentro del informe -->
      <rect x="-14" y="-14" width="4" height="8" rx="1" fill="#0A2A66">
        <animate attributeName="height" values="8;14;8" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-14;-20;-14" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-8" y="-10" width="4" height="4" rx="1" fill="#0A2A66">
        <animate attributeName="height" values="4;10;4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-10;-16;-10" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="-2" y="-16" width="4" height="10" rx="1" fill="#0A2A66">
        <animate attributeName="height" values="10;4;10" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-16;-10;-16" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="4" y="-12" width="4" height="6" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="6;14;6" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-12;-20;-12" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="-6" width="4" height="2" rx="1" fill="#0A2A66">
        <animate attributeName="height" values="2;8;2" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-6;-12;-6" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Líneas de texto inferiores -->
      <rect x="-14" y="2" width="28" height="2" rx="1" fill="#0A2A66" opacity="0.7"/>
      <rect x="-14" y="7" width="20" height="2" rx="1" fill="#0A2A66" opacity="0.6"/>
      <rect x="-14" y="12" width="24" height="2" rx="1" fill="#0A2A66" opacity="0.5"/>
      <!-- Brillo -->
      <rect x="-16" y="-16" width="32" height="2" rx="1" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- 🥧 GRÁFICO CIRCULAR (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <!-- Círculo exterior -->
      <circle r="22" fill="url(#gradAI)"/>
      <!-- Sector 1 (25%) -->
      <path d="M 0 0 L 0 -22 A 22 22 0 0 1 22 0 Z" fill="#22C1E0"/>
      <!-- Sector 2 (35%) -->
      <path d="M 0 0 L 22 0 A 22 22 0 0 1 0 22 Z" fill="#1E6FE8" opacity="0.85"/>
      <!-- Sector 3 (40%) -->
      <path d="M 0 0 L 0 22 A 22 22 0 0 1 -22 0 Z" fill="#0A2A66" opacity="0.7"/>
      <!-- Centro hueco -->
      <circle r="8" fill="#0A2A66" opacity="0.5"/>
      <circle r="4" fill="#ffffff" opacity="0.9"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-12" rx="4" ry="2" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 🔍 LUPA / ANÁLISIS (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 3; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Cristal de la lupa -->
      <circle r="18" fill="url(#gradAI)"/>
      <circle r="13" fill="#0A2A66" opacity="0.7"/>
      <!-- Reflejo -->
      <ellipse cx="-5" cy="-5" rx="5" ry="3" fill="#ffffff" opacity="0.5"/>
      <!-- Mango -->
      <rect x="14" y="10" width="10" height="22" rx="5"
            transform="rotate(-45 19 20)" fill="url(#gradAI)"/>
      <!-- Datos dentro de la lupa -->
      <g fill="#22C1E0">
        <rect x="-8" y="-6" width="3" height="6" rx="1">
          <animate attributeName="height" values="6;10;6" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-6;-10;-6" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="-3" y="-3" width="3" height="3" rx="1">
          <animate attributeName="height" values="3;8;3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-3;-8;-3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="2" y="-8" width="3" height="8" rx="1">
          <animate attributeName="height" values="8;3;8" dur="2s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="-8;-3;-8" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- 📅 PERÍODO / FECHAS (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del calendario -->
      <rect x="-18" y="-16" width="36" height="38" rx="4" fill="url(#gradAI)"/>
      <!-- Cabecera del calendario -->
      <rect x="-18" y="-16" width="36" height="10" rx="4" fill="#0A2A66" opacity="0.8"/>
      <!-- Anillos -->
      <circle cx="-10" cy="-20" r="2.5" fill="url(#gradAI)"/>
      <circle cx="0" cy="-20" r="2.5" fill="url(#gradAI)"/>
      <circle cx="10" cy="-20" r="2.5" fill="url(#gradAI)"/>
      <!-- Días -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="-10" cy="-2" r="2"/>
        <circle cx="-2" cy="-2" r="2"/>
        <circle cx="6" cy="-2" r="2" fill="#22C1E0">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="-2" r="2"/>
        <circle cx="-10" cy="6" r="2"/>
        <circle cx="-2" cy="6" r="2"/>
        <circle cx="6" cy="6" r="2"/>
        <circle cx="14" cy="6" r="2"/>
        <circle cx="-10" cy="14" r="2"/>
        <circle cx="-2" cy="14" r="2"/>
        <circle cx="6" cy="14" r="2"/>
        <circle cx="14" cy="14" r="2"/>
      </g>
      <!-- Brillo -->
      <rect x="-14" y="-14" width="28" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ✅ CONCLUSIONES / CHECK (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.08 1.08; 1 1" dur="1.4s" repeatCount="indefinite"/>
      <!-- Círculo de fondo -->
      <circle r="22" fill="url(#gradAI)"/>
      <!-- Check grande -->
      <path d="M -12 2 L -4 10 L 12 -8" fill="none"
            stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="5" ry="3" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>