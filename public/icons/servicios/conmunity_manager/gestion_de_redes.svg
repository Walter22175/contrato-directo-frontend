<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Gestión de Redes - Contrato Directo">

  <defs>
    <linearGradient id="gradGR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroGR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradNodos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowGR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroGR)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowGR)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🌐 RED DE NODOS CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: los nodos giran suavemente -->
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="25s" repeatCount="indefinite"/>

      <!-- Líneas de conexión (red) -->
      <g stroke="url(#gradNodos)" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="0" y1="-48" x2="-42" y2="-22"/>
        <line x1="-42" y1="-22" x2="-42" y2="22"/>
        <line x1="-42" y1="22" x2="0" y2="48"/>
        <line x1="0" y1="48" x2="42" y2="22"/>
        <line x1="42" y1="22" x2="42" y2="-22"/>
        <line x1="42" y1="-22" x2="0" y2="-48"/>
        <line x1="-42" y1="-22" x2="42" y2="-22"/>
        <line x1="-42" y1="22" x2="42" y2="22"/>
        <line x1="0" y1="-48" x2="0" y2="48"/>
      </g>

      <!-- Nodos periféricos -->
      <g fill="url(#gradNodos)">
        <circle cx="0" cy="-48" r="8"/>
        <circle cx="-42" cy="-22" r="8"/>
        <circle cx="-42" cy="22" r="8"/>
        <circle cx="0" cy="48" r="8"/>
        <circle cx="42" cy="22" r="8"/>
        <circle cx="42" cy="-22" r="8"/>
      </g>

      <!-- Nodo central (hub de gestión) -->
      <circle r="20" fill="url(#gradGR)"/>
      <circle r="12" fill="#0A2A66" opacity="0.6"/>
      <!-- Icono de gestión dentro del hub (engranaje mini) -->
      <g fill="#22C1E0">
        <path d="M 0 -6 L 2 -6 L 2 -4 L -2 -4 L -2 -6 Z
                 M 0 6 L 2 6 L 2 4 L -2 4 L -2 6 Z
                 M -6 0 L -6 -2 L -4 -2 L -4 2 L -6 2 Z
                 M 6 0 L 6 -2 L 4 -2 L 4 2 L 6 2 Z"/>
        <circle r="3" fill="#ffffff"/>
        <circle r="1.5" fill="#22C1E0"/>
      </g>

      <!-- Pulso de red -->
      <circle r="48" fill="none" stroke="#22C1E0" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="46;58;46" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📊 DASHBOARD / MÉTRICAS (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Panel del dashboard -->
      <rect x="-24" y="-18" width="48" height="34" rx="4" fill="url(#gradGR)"/>
      <!-- Pantalla -->
      <rect x="-20" y="-14" width="40" height="26" rx="2" fill="#0A2A66" opacity="0.9"/>
      <!-- Barras animadas -->
      <rect x="-16" y="2" width="4" height="6" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="6;10;6" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-2;2" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-9" y="-2" width="4" height="10" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="10;4;10" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-2;4;-2" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-2" y="0" width="4" height="8" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="8;12;8" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-4;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="5" y="-4" width="4" height="12" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="12;6;12" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-4;2;-4" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="0" width="4" height="8" rx="1" fill="#22C1E0">
        <animate attributeName="height" values="8;12;8" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-4;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-16" y="-10" width="32" height="2" rx="1" fill="#22C1E0" opacity="0.6"/>
      <!-- Base -->
      <rect x="-6" y="16" width="12" height="4" rx="2" fill="url(#gradGR)"/>
      <rect x="-12" y="19" width="24" height="3" rx="1.5" fill="url(#gradGR)"/>
    </g>
  </g>

  <!-- ⚙️ CONFIGURACIÓN / AJUSTES (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <!-- Dientes del engranaje -->
      <path d="M 0 -24 L 6 -24 L 6 -18 L -6 -18 L -6 -24 Z
               M 0 24 L 6 24 L 6 18 L -6 18 L -6 24 Z
               M -24 0 L -24 -6 L -18 -6 L -18 6 L -24 6 Z
               M 24 0 L 24 -6 L 18 -6 L 18 6 L 24 6 Z
               M -17 -17 L -13 -21 L -17 -25 L -21 -21 Z
               M 17 -17 L 21 -21 L 17 -25 L 13 -21 Z
               M -17 17 L -21 21 L -17 25 L -13 21 Z
               M 17 17 L 13 21 L 17 25 L 21 21 Z"
            fill="url(#gradGR)"/>
      <circle r="17" fill="url(#gradGR)"/>
      <circle r="7" fill="#ffffff" opacity="0.9"/>
      <!-- Mini engranaje dentro -->
      <g>
        <path d="M 0 -5 L 1.5 -5 L 1.5 -3 L -1.5 -3 L -1.5 -5 Z
                 M 0 5 L 1.5 5 L 1.5 3 L -1.5 3 L -1.5 5 Z
                 M -5 0 L -5 -1.5 L -3 -1.5 L -3 1.5 L -5 1.5 Z
                 M 5 0 L 5 -1.5 L 3 -1.5 L 3 1.5 L 5 1.5 Z" fill="#22C1E0"/>
        <circle r="1.5" fill="#22C1E0"/>
      </g>
    </g>
  </g>

  <!-- 🔐 SEGURIDAD / FIREWALL (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Escudo -->
      <path d="M 0 -24 L 20 -16 L 20 4 Q 20 18 0 26 Q -20 18 -20 4 L -20 -16 Z"
            fill="url(#gradGR)"/>
      <!-- Candado dentro -->
      <rect x="-7" y="-4" width="14" height="12" rx="2" fill="#ffffff" opacity="0.95"/>
      <path d="M -4 -4 L -4 -7 Q -4 -10 0 -10 Q 4 -10 4 -7 L 4 -4"
            fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="1" r="1.5" fill="#0A2A66"/>
      <!-- Brillo -->
      <path d="M -12 -12 L 12 -12 L 10 -14 L -10 -14 Z" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- 🔄 SINCRONIZACIÓN / BACKUP (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      <!-- Flechas circulares -->
      <path d="M -22 -6 A 22 22 0 0 1 22 -6" fill="none"
            stroke="url(#gradGR)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 22 -6 L 16 -12 L 26 -12 Z" fill="url(#gradGR)"/>
      <path d="M 22 6 A 22 22 0 0 1 -22 6" fill="none"
            stroke="url(#gradGR)" stroke-width="5" stroke-linecap="round"/>
      <path d="M -22 6 L -16 12 L -26 12 Z" fill="url(#gradGR)"/>
      <!-- Centro -->
      <circle r="7" fill="url(#gradGR)"/>
      <circle r="3" fill="#22C1E0"/>
    </g>
  </g>

  <!-- 🖧 SERVIDOR / RACK (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Rack de servidores -->
      <rect x="-18" y="-22" width="36" height="44" rx="4" fill="url(#gradGR)"/>
      <!-- Servidores (3) -->
      <rect x="-14" y="-18" width="28" height="10" rx="2" fill="#0A2A66" opacity="0.7"/>
      <rect x="-14" y="-4" width="28" height="10" rx="2" fill="#0A2A66" opacity="0.7"/>
      <rect x="-14" y="10" width="28" height="10" rx="2" fill="#0A2A66" opacity="0.7"/>
      <!-- LEDs -->
      <circle cx="-8" cy="-13" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-8" cy="1" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-8" cy="15" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Líneas de datos -->
      <g stroke="#22C1E0" stroke-width="1" opacity="0.6">
        <line x1="0" y1="-13" x2="10" y2="-13"/>
        <line x1="0" y1="1" x2="10" y2="1"/>
        <line x1="0" y1="15" x2="10" y2="15"/>
      </g>
    </g>
  </g>

  <!-- 📡 SEÑAL / CONECTIVIDAD (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Punto base -->
      <circle cx="0" cy="14" r="4" fill="url(#gradGR)"/>
      <!-- Arcos de señal -->
      <path d="M -12 4 A 16 16 0 0 1 12 4" fill="none"
            stroke="url(#gradGR)" stroke-width="4" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -22 -8 A 30 30 0 0 1 22 -8" fill="none"
            stroke="url(#gradGR)" stroke-width="4" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -32 -20 A 44 44 0 0 1 32 -20" fill="none"
            stroke="url(#gradGR)" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (paquetes) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>