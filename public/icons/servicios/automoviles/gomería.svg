<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Gomería de Auto - Contrato Directo">

  <defs>
    <linearGradient id="gradGOM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroGOM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradNeumatico" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <linearGradient id="gradCarroceriaGOM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="50%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradCristalGOM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowGOM" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroGOM)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowGOM)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🛞 NEUMÁTICO CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: la rueda gira lentamente -->
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>

      <!-- Neumático exterior -->
      <circle r="52" fill="#0A2A66"/>
      <!-- Dibujo de la banda de rodamiento -->
      <g stroke="#1E6FE8" stroke-width="2" opacity="0.7">
        <line x1="0" y1="-50" x2="0" y2="-44"/>
        <line x1="12" y1="-49" x2="11" y2="-43"/>
        <line x1="24" y1="-45" x2="22" y2="-39"/>
        <line x1="-12" y1="-49" x2="-11" y2="-43"/>
        <line x1="-24" y1="-45" x2="-22" y2="-39"/>
        <line x1="0" y1="50" x2="0" y2="44"/>
        <line x1="12" y1="49" x2="11" y2="43"/>
        <line x1="24" y1="45" x2="22" y2="39"/>
        <line x1="-12" y1="49" x2="-11" y2="43"/>
        <line x1="-24" y1="45" x2="-22" y2="39"/>
        <line x1="50" y1="0" x2="44" y2="0"/>
        <line x1="49" y1="12" x2="43" y2="11"/>
        <line x1="45" y1="24" x2="39" y2="22"/>
        <line x1="49" y1="-12" x2="43" y2="-11"/>
        <line x1="45" y1="-24" x2="39" y2="-22"/>
        <line x1="-50" y1="0" x2="-44" y2="0"/>
        <line x1="-49" y1="12" x2="-43" y2="11"/>
        <line x1="-45" y1="24" x2="-39" y2="22"/>
        <line x1="-49" y1="-12" x2="-43" y2="-11"/>
        <line x1="-45" y1="-24" x2="-39" y2="-22"/>
      </g>

      <!-- Llanta metálica -->
      <circle r="32" fill="url(#gradNeumatico)"/>
      <!-- Borde interior -->
      <circle r="26" fill="#0A2A66" opacity="0.7"/>

      <!-- Radios de la llanta (5) -->
      <g fill="url(#gradGOM)">
        <path d="M -4 -26 L 4 -26 L 6 -6 L -6 -6 Z"/>
        <path d="M 22 -14 L 26 -8 L 8 -2 L 4 -8 Z"/>
        <path d="M 14 22 L 8 26 L 0 8 L 6 4 Z"/>
        <path d="M -14 22 L -8 26 L 0 8 L -6 4 Z"/>
        <path d="M -22 -14 L -26 -8 L -8 -2 L -4 -8 Z"/>
      </g>

      <!-- Centro de la llanta -->
      <circle r="8" fill="url(#gradGOM)"/>
      <circle r="3" fill="#ffffff" opacity="0.9"/>

      <!-- Brillo superior -->
      <ellipse cx="-14" cy="-28" rx="10" ry="4" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 🏎️ AUTO DEPORTIVO (12 en punto) -->
  <g transform="translate(200 118) scale(0.65)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 0; 0 0; -3 0; 0 0" dur="3.5s" repeatCount="indefinite"/>

      <!-- Sombra del auto -->
      <ellipse cx="0" cy="14" rx="38" ry="3" fill="#0A2A66" opacity="0.35"/>

      <!-- CARROCERÍA DEPORTIVA -->
      <path d="M -36 8
               L -36 2
               Q -36 -3 -32 -5
               L -22 -6
               Q -16 -15 -4 -17
               Q 8 -17 14 -13
               Q 20 -10 26 -5
               L 34 -4
               Q 38 -3 38 2
               L 38 8
               Q 38 12 34 12
               L -34 12
               Q -38 12 -38 8 Z"
            fill="url(#gradCarroceriaGOM)"/>

      <!-- Línea de carácter lateral -->
      <path d="M -32 3 L 34 3" stroke="#0A2A66"
            stroke-width="1.2" opacity="0.4" fill="none"/>

      <!-- Cristales fastback -->
      <path d="M -16 -6
               Q -10 -13 0 -14
               Q 8 -14 14 -11
               L 18 -6 Z"
            fill="url(#gradCristalGOM)"/>
      <!-- Pilar B -->
      <line x1="-2" y1="-14" x2="-2" y2="-6"
            stroke="#0A2A66" stroke-width="1.5" opacity="0.6"/>

      <!-- Hood scoop -->
      <path d="M 8 -10 L 18 -10 L 19 -7 L 7 -7 Z"
            fill="#0A2A66" opacity="0.7"/>

      <!-- Faro delantero angular -->
      <path d="M 30 -2 L 37 -2 L 38 1 L 30 2 Z" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
      </path>

      <!-- Faros traseros dobles -->
      <rect x="-38" y="-3" width="6" height="2.5" rx="1" fill="#22C1E0"/>
      <rect x="-38" y="1" width="6" height="2.5" rx="1" fill="#22C1E0"/>

      <!-- Splitter delantero -->
      <path d="M 30 12 L 42 12 L 40 15 L 28 15 Z"
            fill="#0A2A66" opacity="0.85"/>
      <!-- Difusor trasero -->
      <path d="M -42 12 L -30 12 L -28 15 L -40 15 Z"
            fill="#0A2A66" opacity="0.85"/>

      <!-- Rueda trasera deportiva -->
      <circle cx="-22" cy="12" r="8" fill="#0A2A66"/>
      <circle cx="-22" cy="12" r="4" fill="url(#gradGOM)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="-26" y1="12" x2="-18" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="8" x2="-22" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </line>

      <!-- Rueda delantera deportiva -->
      <circle cx="24" cy="12" r="8" fill="#0A2A66"/>
      <circle cx="24" cy="12" r="4" fill="url(#gradGOM)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="20" y1="12" x2="28" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="24" y1="8" x2="24" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </line>

      <!-- Brillo superior deportivo -->
      <path d="M -26 -4 Q -12 -8 0 -8 Q 12 -8 22 -4 L 18 -6 Q 6 -9 -6 -9 Q -20 -9 -26 -6 Z"
            fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- 🔧 LLAVE DE CRUZ / PISTOLA DE IMPACTO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-15; 15; -15" dur="2.4s" repeatCount="indefinite"/>
      <!-- Cuerpo central de la llave de cruz -->
      <circle r="10" fill="url(#gradGOM)"/>
      <circle r="4" fill="#0A2A66"/>
      <!-- Brazo 1 (arriba) -->
      <rect x="-3" y="-42" width="6" height="32" rx="2" fill="url(#gradGOM)"/>
      <rect x="-6" y="-46" width="12" height="6" rx="2" fill="url(#gradGOM)"/>
      <!-- Brazo 2 (abajo) -->
      <rect x="-3" y="10" width="6" height="32" rx="2" fill="url(#gradGOM)"/>
      <rect x="-6" y="40" width="12" height="6" rx="2" fill="url(#gradGOM)"/>
      <!-- Brazo 3 (izquierda) -->
      <rect x="-42" y="-3" width="32" height="6" rx="2" fill="url(#gradGOM)"/>
      <rect x="-46" y="-6" width="6" height="12" rx="2" fill="url(#gradGOM)"/>
      <!-- Brazo 4 (derecha) -->
      <rect x="10" y="-3" width="32" height="6" rx="2" fill="url(#gradGOM)"/>
      <rect x="40" y="-6" width="6" height="12" rx="2" fill="url(#gradGOM)"/>
      <!-- Tuerca central -->
      <circle r="5" fill="url(#gradGOM)"/>
      <circle r="2" fill="#22C1E0"/>
    </g>
  </g>

  <!-- 💨 INFLADOR / COMPRESOR (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Cuerpo del compresor -->
      <rect x="-22" y="-18" width="44" height="34" rx="5" fill="url(#gradGOM)"/>
      <!-- Manómetro circular -->
      <circle cx="-8" cy="-8" r="8" fill="#ffffff" opacity="0.9"/>
      <circle cx="-8" cy="-8" r="6" fill="none" stroke="#0A2A66" stroke-width="1"/>
      <!-- Aguja del manómetro -->
      <line x1="-8" y1="-8" x2="-4" y2="-12" stroke="#22C1E0" stroke-width="1.8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 -8 -8; 10 -8 -8; -10 -8 -8" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="-8" cy="-8" r="1.5" fill="#0A2A66"/>
      <!-- Boquilla de inflado -->
      <path d="M 22 -6 L 30 -6 L 30 6 L 22 6"
            fill="none" stroke="url(#gradGOM)" stroke-width="4" stroke-linecap="round"/>
      <!-- Manguera -->
      <path d="M 8 16 Q 16 26 22 22 Q 28 18 26 10"
            fill="none" stroke="url(#gradGOM)" stroke-width="3.5"
            stroke-linecap="round"/>
      <!-- Aire saliendo -->
      <g fill="#22C1E0">
        <circle cx="34" cy="0" r="2">
          <animate attributeName="cx" values="32;42;32" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="34" cy="-6" r="1.5">
          <animate attributeName="cx" values="32;40;32" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="34" cy="6" r="1.5">
          <animate attributeName="cx" values="32;40;32" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- 🧰 PARCHE / REPARACIÓN (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6; 6; -6" dur="3s" repeatCount="indefinite"/>
      <!-- Parche circular -->
      <circle r="22" fill="url(#gradGOM)"/>
      <circle r="16" fill="#0A2A66" opacity="0.7"/>
      <!-- Textura del parche -->
      <g stroke="#22C1E0" stroke-width="1" opacity="0.6">
        <line x1="-14" y1="-8" x2="14" y2="-8"/>
        <line x1="-14" y1="-2" x2="14" y2="-2"/>
        <line x1="-14" y1="4" x2="14" y2="4"/>
        <line x1="-14" y1="10" x2="14" y2="10"/>
      </g>
      <!-- Centro del parche -->
      <circle r="4" fill="url(#gradGOM)"/>
      <!-- Herramienta de reparación (despinchadora) -->
      <path d="M 22 -10 L 30 -14 L 34 -6 L 26 -2 Z" fill="url(#gradGOM)"/>
      <circle cx="32" cy="-4" r="4" fill="url(#gradGOM)"/>
      <circle cx="32" cy="-4" r="1.5" fill="#22C1E0"/>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-12" rx="6" ry="3" fill="#ffffff" opacity="0.3"/>
    </g>
  </g>

  <!-- 👨‍🔧 OPERARIO CON LLAVE (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cabeza del operario -->
      <circle cx="-8" cy="-12" r="10" fill="url(#gradGOM)"/>
      <!-- Gorra de trabajo -->
      <path d="M -18 -16 Q -18 -24 -8 -24 Q 2 -24 2 -16 Z" fill="url(#gradGOM)"/>
      <rect x="-18" y="-16" width="20" height="3" rx="1.5" fill="url(#gradGOM)"/>
      <!-- Cuerpo -->
      <path d="M -18 6 Q -20 -2 -8 -4 Q 4 -2 2 6 L 2 18 L -18 18 Z"
            fill="url(#gradGOM)"/>
      <!-- Brazo con llave -->
      <path d="M 2 -2 L 14 -6 L 16 0 L 4 4 Z" fill="url(#gradGOM)"/>
      <!-- Llave en mano -->
      <rect x="14" y="-10" width="4" height="16" rx="2" fill="url(#gradGOM)"/>
      <path d="M 12 -10 Q 12 -16 16 -16 Q 20 -16 20 -10 L 17 -10 Q 17 -13 16 -13 Q 15 -13 15 -10 Z"
            fill="url(#gradGOM)"/>
      <!-- Detalles del uniforme -->
      <rect x="-14" y="2" width="14" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
      <rect x="-14" y="8" width="14" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
      <!-- Cara -->
      <circle cx="-10" cy="-12" r="1.5" fill="#0A2A66"/>
      <circle cx="-6" cy="-12" r="1.5" fill="#0A2A66"/>
    </g>
  </g>

  <!-- ⚖️ BALANCEADORA / ALINEACIÓN (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4; 4; -4" dur="3s" repeatCount="indefinite"/>
      <!-- Base de la balanceadora -->
      <rect x="-22" y="-10" width="44" height="28" rx="4" fill="url(#gradGOM)"/>
      <!-- Pantalla digital -->
      <rect x="-16" y="-6" width="32" height="12" rx="2" fill="#0A2A66" opacity="0.9"/>
      <!-- Números en pantalla -->
      <rect x="-12" y="-3" width="6" height="6" rx="1" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-3" y="-3" width="6" height="6" rx="1" fill="#22C1E0" opacity="0.7"/>
      <rect x="6" y="-3" width="6" height="6" rx="1" fill="#22C1E0" opacity="0.5"/>
      <!-- Eje de la balanceadora -->
      <rect x="-3" y="-30" width="6" height="20" rx="2" fill="url(#gradGOM)"/>
      <!-- Rueda montada en el eje -->
      <circle cx="0" cy="-30" r="12" fill="#0A2A66"/>
      <circle cx="0" cy="-30" r="6" fill="url(#gradGOM)"/>
      <circle cx="0" cy="-30" r="2" fill="#22C1E0"/>
      <!-- LED indicador -->
      <circle cx="16" cy="12" r="2" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>