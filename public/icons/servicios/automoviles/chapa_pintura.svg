<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Pintor de Auto - Contrato Directo">

  <defs>
    <linearGradient id="gradPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPistola" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <linearGradient id="gradCarroceriaPA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="50%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradCristalPA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowPA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPA)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPA)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🎨 PISTOLA DE PINTURA CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g transform="rotate(-25)">
      <animateTransform attributeName="transform" type="rotate"
        values="-25; -18; -25" dur="3s" repeatCount="indefinite"/>

      <!-- Cuerpo de la pistola -->
      <rect x="-22" y="-18" width="44" height="22" rx="5" fill="url(#gradPistola)"/>
      <!-- Brillo del cuerpo -->
      <rect x="-18" y="-14" width="36" height="3" rx="1.5" fill="#ffffff" opacity="0.4"/>

      <!-- Depósito de pintura (vaso) -->
      <path d="M -12 -18 L 12 -18 L 8 -34 L -8 -34 Z" fill="url(#gradPA)"/>
      <!-- Nivel de pintura dentro -->
      <path d="M -10 -18 L 10 -18 L 8 -26 L -8 -26 Z" fill="#22C1E0" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <!-- Tapa del depósito -->
      <rect x="-10" y="-38" width="20" height="5" rx="2" fill="url(#gradPistola)"/>

      <!-- Gatillo -->
      <path d="M -4 4 L -10 10 L -8 14 L -2 8 Z" fill="url(#gradPistola)"/>

      <!-- Mango -->
      <rect x="-10" y="4" width="12" height="26" rx="4" fill="url(#gradPistola)"/>

      <!-- Boquilla / pico -->
      <rect x="22" y="-12" width="14" height="8" rx="3" fill="url(#gradPistola)"/>
      <!-- Aguja interior -->
      <rect x="34" y="-11" width="4" height="6" rx="1" fill="#0A2A66"/>

      <!-- Aire / spray saliendo -->
      <g fill="#22C1E0">
        <circle cx="44" cy="-10" r="2">
          <animate attributeName="cx" values="38;52;38" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="46" cy="-6" r="1.5">
          <animate attributeName="cx" values="38;54;38" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="48" cy="-14" r="1.5">
          <animate attributeName="cx" values="38;56;38" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="52" cy="-10" r="1">
          <animate attributeName="cx" values="38;58;38" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Gatillo presionado -->
      <circle cx="-6" cy="11" r="1.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 🏎️ AUTO DEPORTIVO (12 en punto) -->
  <g transform="translate(200 118) scale(0.65)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 3 0; 0 0; -3 0; 0 0" dur="3.5s" repeatCount="indefinite"/>

      <!-- Sombra del auto -->
      <ellipse cx="0" cy="14" rx="38" ry="3" fill="#0A2A66" opacity="0.35"/>

      <!-- CARROCERÍA DEPORTIVA -->
      <path d="M -36 8
               L -36 2
               Q -36 -3 -32 -5
               L -22 -6
               Q -16 -15 -4 -17
               Q 8 -17 14 -13
               Q 20 -10 26 -5
               L 34 -4
               Q 38 -3 38 2
               L 38 8
               Q 38 12 34 12
               L -34 12
               Q -38 12 -38 8 Z"
            fill="url(#gradCarroceriaPA)"/>

      <!-- Línea de carácter lateral -->
      <path d="M -32 3 L 34 3" stroke="#0A2A66"
            stroke-width="1.2" opacity="0.4" fill="none"/>

      <!-- Cristales fastback -->
      <path d="M -16 -6
               Q -10 -13 0 -14
               Q 8 -14 14 -11
               L 18 -6 Z"
            fill="url(#gradCristalPA)"/>
      <!-- Pilar B -->
      <line x1="-2" y1="-14" x2="-2" y2="-6"
            stroke="#0A2A66" stroke-width="1.5" opacity="0.6"/>

      <!-- Hood scoop -->
      <path d="M 8 -10 L 18 -10 L 19 -7 L 7 -7 Z"
            fill="#0A2A66" opacity="0.7"/>

      <!-- Faro delantero angular -->
      <path d="M 30 -2 L 37 -2 L 38 1 L 30 2 Z" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
      </path>

      <!-- Faros traseros dobles -->
      <rect x="-38" y="-3" width="6" height="2.5" rx="1" fill="#22C1E0"/>
      <rect x="-38" y="1" width="6" height="2.5" rx="1" fill="#22C1E0"/>

      <!-- Splitter delantero -->
      <path d="M 30 12 L 42 12 L 40 15 L 28 15 Z"
            fill="#0A2A66" opacity="0.85"/>
      <!-- Difusor trasero -->
      <path d="M -42 12 L -30 12 L -28 15 L -40 15 Z"
            fill="#0A2A66" opacity="0.85"/>

      <!-- Rueda trasera deportiva -->
      <circle cx="-22" cy="12" r="8" fill="#0A2A66"/>
      <circle cx="-22" cy="12" r="4" fill="url(#gradPA)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="-26" y1="12" x2="-18" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="8" x2="-22" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -22 12" to="360 -22 12" dur="1.2s" repeatCount="indefinite"/>
      </line>

      <!-- Rueda delantera deportiva -->
      <circle cx="24" cy="12" r="8" fill="#0A2A66"/>
      <circle cx="24" cy="12" r="4" fill="url(#gradPA)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="20" y1="12" x2="28" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="24" y1="8" x2="24" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate"
          from="0 24 12" to="360 24 12" dur="1.2s" repeatCount="indefinite"/>
      </line>

      <!-- Brillo superior deportivo -->
      <path d="M -26 -4 Q -12 -8 0 -8 Q 12 -8 22 -4 L 18 -6 Q 6 -9 -6 -9 Q -20 -9 -26 -6 Z"
            fill="#ffffff" opacity="0.35"/>

      <!-- Reflejo de pintura (recién pintado) -->
      <ellipse cx="-10" cy="2" rx="12" ry="2" fill="#ffffff" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.1;0.25" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 🧴 LATA / BALDE DE PINTURA (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Asa de la lata -->
      <path d="M -14 -18 Q 0 -28 14 -18"
            fill="none" stroke="url(#gradPA)" stroke-width="3.5"
            stroke-linecap="round"/>
      <!-- Cuerpo de la lata -->
      <path d="M -20 -14 L 20 -14 L 16 22 L -16 22 Z" fill="url(#gradPA)"/>
      <!-- Borde superior -->
      <rect x="-22" y="-18" width="44" height="6" rx="2" fill="url(#gradPA)"/>
      <!-- Pintura dentro -->
      <ellipse cx="0" cy="-14" rx="18" ry="4" fill="#22C1E0" opacity="0.9"/>
      <!-- Etiqueta -->
      <rect x="-14" y="-4" width="28" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
      <rect x="-10" y="0" width="20" height="3" rx="1.5" fill="#0A2A66"/>
      <rect x="-10" y="5" width="14" height="2.5" rx="1.25" fill="#22C1E0"/>
      <rect x="-10" y="10" width="18" height="2.5" rx="1.25" fill="#1E6FE8"/>
      <!-- Goteo -->
      <path d="M 12 22 Q 12 30 10 34 Q 8 38 10 40"
            fill="none" stroke="#22C1E0" stroke-width="3"
            stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Brillo -->
      <path d="M -14 -10 L -10 18 L -6 18 L -10 -10 Z"
            fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- 🖌️ PINCEL (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g transform="rotate(-25)">
      <animateTransform attributeName="transform" type="rotate"
        values="-25; -18; -25" dur="3s" repeatCount="indefinite" additive="replace"/>
      <!-- Mango -->
      <rect x="-5" y="-38" width="10" height="60" rx="5" fill="url(#gradPA)"/>
      <!-- Virola metálica -->
      <rect x="-7" y="20" width="14" height="8" rx="2" fill="url(#gradPA)"/>
      <rect x="-7" y="22" width="14" height="1.5" fill="#ffffff" opacity="0.4"/>
      <rect x="-7" y="25" width="14" height="1.5" fill="#ffffff" opacity="0.4"/>
      <!-- Cerdas -->
      <path d="M -6 28 L 6 28 L 4 42 Q 0 46 -4 42 Z"
            fill="url(#gradPA)"/>
      <!-- Punta con pintura -->
      <path d="M -4 40 Q 0 44 4 40 L 3 46 Q 0 48 -3 46 Z"
            fill="#22C1E0"/>
      <!-- Gota de pintura -->
      <circle cx="0" cy="50" r="2" fill="#22C1E0">
        <animate attributeName="cy" values="46;58;46" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 📏 CINTA DE ENMASCARAR (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6; 6; -6" dur="3s" repeatCount="indefinite"/>
      <!-- Rollo de cinta -->
      <circle r="20" fill="url(#gradPA)"/>
      <circle r="7" fill="#ffffff" opacity="0.9"/>
      <!-- Cinta saliendo -->
      <path d="M 16 -12 L 26 -16 L 30 -8 Q 32 0 28 8 L 20 6 Z"
            fill="url(#gradPA)"/>
      <!-- Líneas de la cinta -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.7">
        <line x1="22" y1="-12" x2="26" y2="-8"/>
        <line x1="26" y1="-4" x2="30" y2="0"/>
        <line x1="27" y1="4" x2="28" y2="8"/>
      </g>
      <!-- Brillo -->
      <ellipse cx="-8" cy="-10" rx="4" ry="2" fill="#ffffff" opacity="0.5"/>
      <!-- Extremo de la cinta -->
      <path d="M 30 -8 L 38 -6 L 36 0 L 28 4 Z" fill="url(#gradPA)" opacity="0.85"/>
    </g>
  </g>

  <!-- 😷 MÁSCARA / CARETA (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo de la máscara -->
      <path d="M -20 -14 Q 0 -20 20 -14 Q 22 -4 18 8 Q 0 14 -18 8 Q -22 -4 -20 -14 Z"
            fill="url(#gradPA)"/>
      <!-- Filtros laterales -->
      <circle cx="-16" cy="0" r="5" fill="url(#gradPA)"/>
      <circle cx="16" cy="0" r="5" fill="url(#gradPA)"/>
      <circle cx="-16" cy="0" r="2" fill="#0A2A66" opacity="0.7"/>
      <circle cx="16" cy="0" r="2" fill="#0A2A66" opacity="0.7"/>
      <!-- Válvula central -->
      <rect x="-4" y="6" width="8" height="6" rx="2" fill="url(#gradPA)"/>
      <!-- Elástico -->
      <path d="M -20 -10 L -28 -10" stroke="url(#gradPA)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 20 -10 L 28 -10" stroke="url(#gradPA)" stroke-width="3" stroke-linecap="round"/>
      <!-- Brillo -->
      <path d="M -14 -12 Q 0 -16 14 -12 L 12 -10 Q 0 -13 -12 -10 Z"
            fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- 💨 VENTILACIÓN / CABINA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Caja de ventilación -->
      <rect x="-20" y="-16" width="40" height="36" rx="4" fill="url(#gradPA)"/>
      <!-- Rejilla -->
      <g fill="#0A2A66" opacity="0.6">
        <rect x="-14" y="-10" width="28" height="2" rx="1"/>
        <rect x="-14" y="-5" width="28" height="2" rx="1"/>
        <rect x="-14" y="0" width="28" height="2" rx="1"/>
        <rect x="-14" y="5" width="28" height="2" rx="1"/>
      </g>
      <!-- Aspas girando -->
      <circle cx="0" cy="12" r="5" fill="none" stroke="url(#gradPA)" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 12" to="360 0 12" dur="2s" repeatCount="indefinite"/>
      </circle>
      <line x1="0" y1="7" x2="0" y2="17" stroke="url(#gradPA)" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 12" to="360 0 12" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="-5" y1="12" x2="5" y2="12" stroke="url(#gradPA)" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 12" to="360 0 12" dur="2s" repeatCount="indefinite"/>
      </line>
      <!-- Aire saliendo -->
      <g stroke="#22C1E0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
        <path d="M 22 -4 Q 28 -4 30 -8">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 22 4 Q 28 4 30 8">
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (gotas de pintura) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>