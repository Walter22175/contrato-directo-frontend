<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Automóvil deportivo - Contrato Directo">

  <defs>
    <linearGradient id="gradAUTO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroAUTO" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradCristal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="gradCarroceria" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="50%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <radialGradient id="glowAUTO" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroAUTO)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowAUTO)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🚗 CAMARO CENTRAL (deportivo, perfil lateral) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el auto avanza y retrocede suavemente -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 6 0; 0 0; -6 0; 0 0" dur="4s" repeatCount="indefinite"/>

      <!-- Sombra del auto en el piso -->
      <ellipse cx="0" cy="22" rx="58" ry="4" fill="#0A2A66" opacity="0.35"/>

      <!-- CARROCERÍA ESTILO CAMARO -->
      <!-- Capó largo, techo fastback, cola corta -->
      <path d="M -58 8
               L -58 0
               Q -58 -6 -52 -8
               L -38 -10
               Q -28 -22 -8 -26
               Q 12 -26 22 -20
               Q 32 -16 40 -8
               L 52 -6
               Q 58 -4 58 2
               L 58 8
               Q 58 14 52 14
               L -52 14
               Q -58 14 -58 8 Z"
            fill="url(#gradCarroceria)"/>

      <!-- Línea de carácter lateral (detalle Camaro) -->
      <path d="M -50 4 L 48 4"
            stroke="#0A2A66" stroke-width="1.5" opacity="0.4"
            fill="none"/>

      <!-- Ventanas / cristales estilo fastback -->
      <path d="M -22 -20
               Q -12 -24 0 -24
               Q 12 -24 20 -20
               L 26 -12
               L -28 -12
               Z"
            fill="url(#gradCristal)"/>

      <!-- Pilar B (separación de cristales) -->
      <line x1="-4" y1="-24" x2="-4" y2="-12"
            stroke="#0A2A66" stroke-width="2" opacity="0.6"/>

      <!-- Entrada de aire del capó (hood scoop) -->
      <path d="M 10 -16 L 28 -16 L 30 -12 L 8 -12 Z"
            fill="#0A2A66" opacity="0.75"/>

      <!-- Faro delantero deportivo (angular) -->
      <path d="M 46 -2 L 56 -2 L 58 2 L 46 4 Z"
            fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
      </path>

      <!-- Faro trasero estilo Camaro (dos rectángulos) -->
      <rect x="-58" y="-4" width="8" height="3" rx="1" fill="#22C1E0"/>
      <rect x="-58" y="2" width="8" height="3" rx="1" fill="#22C1E0"/>

      <!-- Paragolpes delantero (splitter) -->
      <path d="M 48 12 L 62 12 L 60 16 L 46 16 Z"
            fill="#0A2A66" opacity="0.85"/>

      <!-- Paragolpes trasero (difusor) -->
      <path d="M -62 12 L -48 12 L -46 16 L -60 16 Z"
            fill="#0A2A66" opacity="0.85"/>

      <!-- Rueda trasera (más grande, estilo deportivo) -->
      <circle cx="-34" cy="16" r="13" fill="#0A2A66"/>
      <circle cx="-34" cy="16" r="7" fill="url(#gradAUTO)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 -34 16" to="360 -34 16" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Radios de la rueda trasera -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.85">
        <line x1="-34" y1="10" x2="-34" y2="22">
          <animateTransform attributeName="transform" type="rotate"
            from="0 -34 16" to="360 -34 16" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="-40" y1="16" x2="-28" y2="16">
          <animateTransform attributeName="transform" type="rotate"
            from="0 -34 16" to="360 -34 16" dur="1.2s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Rueda delantera (más grande, estilo deportivo) -->
      <circle cx="38" cy="16" r="13" fill="#0A2A66"/>
      <circle cx="38" cy="16" r="7" fill="url(#gradAUTO)">
        <animateTransform attributeName="transform" type="rotate"
          from="0 38 16" to="360 38 16" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Radios de la rueda delantera -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.85">
        <line x1="38" y1="10" x2="38" y2="22">
          <animateTransform attributeName="transform" type="rotate"
            from="0 38 16" to="360 38 16" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="32" y1="16" x2="44" y2="16">
          <animateTransform attributeName="transform" type="rotate"
            from="0 38 16" to="360 38 16" dur="1.2s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Brillo superior (reflejo deportivo) -->
      <path d="M -40 -6 Q -20 -10 0 -10 Q 20 -10 35 -6 L 30 -8 Q 10 -12 -10 -12 Q -25 -12 -40 -8 Z"
            fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- ⛽ SURTIDOR / COMBUSTIBLE (12 en punto) -->
  <g transform="translate(200 118) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <rect x="-16" y="-24" width="32" height="46" rx="5" ry="5"
            fill="url(#gradAUTO)"/>
      <rect x="-11" y="-19" width="22" height="14" rx="3" ry="3"
            fill="#ffffff" opacity="0.9"/>
      <rect x="-8" y="-15" width="16" height="2" rx="1" fill="#0A2A66"/>
      <rect x="-8" y="-10" width="12" height="2" rx="1" fill="#22C1E0">
        <animate attributeName="width" values="12;16;12" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <path d="M 16 -14 Q 26 -14 26 -2 Q 26 12 20 18"
            fill="none" stroke="url(#gradAUTO)" stroke-width="3.5"
            stroke-linecap="round"/>
      <rect x="16" y="16" width="10" height="6" rx="2" ry="2"
            fill="url(#gradAUTO)"/>
    </g>
  </g>

  <!-- 🛞 RUEDA / NEUMÁTICO (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      <circle r="26" fill="#0A2A66"/>
      <circle r="16" fill="url(#gradAUTO)"/>
      <g stroke="#ffffff" stroke-width="2" opacity="0.9">
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="-10" y1="-10" x2="10" y2="10"/>
        <line x1="-10" y1="10" x2="10" y2="-10"/>
      </g>
      <circle r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 🔑 LLAVE / CONTROL (9 en punto) -->
  <g transform="translate(118 200) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-8; 8; -8" dur="3s" repeatCount="indefinite"/>
      <rect x="-20" y="-14" width="40" height="28" rx="8" ry="8"
            fill="url(#gradAUTO)"/>
      <circle cx="-8" cy="-4" r="3.5" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="-4" r="3.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="-8" cy="6" r="3.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="8" cy="6" r="3.5" fill="#22C1E0"/>
      <path d="M 22 -8 A 12 12 0 0 1 22 8" fill="none"
            stroke="#22C1E0" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 28 -14 A 20 20 0 0 1 28 14" fill="none"
            stroke="#22C1E0" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 🛣️ CAMINO / RUTA (3 en punto) -->
  <g transform="translate(282 200) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 4 0; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M -22 26 L -6 -24 L 6 -24 L 22 26 Z"
            fill="url(#gradAUTO)"/>
      <g fill="#ffffff">
        <rect x="-2" y="14" width="4" height="8" rx="1">
          <animate attributeName="y" values="20;14;-2" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="-2" y="0" width="4" height="8" rx="1">
          <animate attributeName="y" values="20;0;-16" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="-2" y="-14" width="4" height="8" rx="1">
          <animate attributeName="y" values="20;-14;-30" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- 🅿️ ESTACIONAMIENTO (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <rect x="-22" y="-22" width="44" height="44" rx="8" ry="8"
            fill="url(#gradAUTO)"/>
      <text x="0" y="10" text-anchor="middle" font-family="sans-serif"
            font-size="34" font-weight="800" fill="#ffffff">P</text>
    </g>
  </g>

  <!-- 🔧 LLAVE MECÁNICA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.55)">
    <g transform="rotate(-35)">
      <animateTransform attributeName="transform" type="rotate"
        values="-35; -25; -35" dur="3s" repeatCount="indefinite" additive="replace"/>
      <rect x="-5" y="-48" width="10" height="80" rx="5" fill="url(#gradAUTO)"/>
      <path d="M -18 -48 Q -18 -64 0 -64 Q 18 -64 18 -48 L 10 -48
               Q 10 -56 0 -56 Q -10 -56 -10 -48 Z" fill="url(#gradAUTO)"/>
      <path d="M -18 32 Q -18 48 0 48 Q 18 48 18 32 L 10 32
               Q 10 40 0 40 Q -10 40 -10 32 Z" fill="url(#gradAUTO)"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>