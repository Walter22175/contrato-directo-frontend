<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono radial de Mantenimiento Edilicio - Contrato Directo">

  <defs>
    <linearGradient id="gradME" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroME" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <radialGradient id="glowME" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroME)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowME)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ⚙️ ENGRANAJE CENTRAL -->
  <g transform="translate(200 200) scale(0.85)">
    <g>
      <path d="M 0 -34 L 7 -34 L 7 -26 L -7 -26 L -7 -34 Z
               M 0 34 L 7 34 L 7 26 L -7 26 L -7 34 Z
               M -34 0 L -34 -7 L -26 -7 L -26 7 L -34 7 Z
               M 34 0 L 34 -7 L 26 -7 L 26 7 L 34 7 Z
               M -24 -24 L -19 -29 L -24 -34 L -29 -29 Z
               M 24 -24 L 29 -29 L 24 -34 L 19 -29 Z
               M -24 24 L -29 29 L -24 34 L -19 29 Z
               M 24 24 L 19 29 L 24 34 L 29 29 Z"
            fill="url(#gradME)"/>
      <circle r="23" fill="url(#gradME)"/>
      <circle r="9" fill="#ffffff" opacity="0.95"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ⛑️ CASCO (12 en punto) -->
  <!-- Grupo exterior: posición + escala (fijos) -->
  <g transform="translate(200 118) scale(0.62)">
    <!-- Grupo interior: solo animación de flotación -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -5; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="8" rx="36" ry="7" fill="url(#gradME)"/>
      <path d="M -30 8 Q -30 -22 0 -26 Q 30 -22 30 8 Z" fill="url(#gradME)"/>
      <path d="M -1.5 -26 Q 0 -32 1.5 -26 L 2.5 8 L -2.5 8 Z" fill="#22C1E0" opacity="0.7"/>
      <ellipse cx="-10" cy="-10" rx="8" ry="4" fill="#ffffff" opacity="0.45">
        <animate attributeName="opacity" values="0.45;0.15;0.45" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 🔧 LLAVE INGLESA (3 en punto) -->
  <g transform="translate(288 200) scale(0.62)">
    <g transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate"
        values="-90; -80; -90" dur="2.6s" repeatCount="indefinite" additive="replace"/>
      <rect x="-6" y="-58" width="12" height="100" rx="6" fill="url(#gradME)"/>
      <path d="M -22 -58 Q -22 -78 0 -78 Q 22 -78 22 -58 L 12 -58
               Q 12 -68 0 -68 Q -12 -68 -12 -58 Z" fill="url(#gradME)"/>
      <path d="M -22 42 Q -22 62 0 62 Q 22 62 22 42 L 12 42
               Q 12 52 0 52 Q -12 52 -12 42 Z" fill="url(#gradME)"/>
    </g>
  </g>

  <!-- 🔨 MARTILLO (10-11 en punto) -->
  <g transform="translate(132 132) scale(0.58)">
    <g transform="rotate(35)">
      <animateTransform attributeName="transform" type="rotate"
        values="35; 28; 35" dur="3s" repeatCount="indefinite" additive="replace"/>
      <rect x="-5" y="-10" width="10" height="90" rx="4" fill="url(#gradME)"/>
      <rect x="-32" y="-32" width="64" height="24" rx="5" fill="url(#gradME)"/>
      <rect x="22" y="-28" width="6" height="16" rx="2" fill="#0A2A66" opacity="0.5"/>
    </g>
  </g>

  <!-- 🪛 DESTORNILLADOR (1-2 en punto) -->
  <g transform="translate(268 132) scale(0.58)">
    <g transform="rotate(-35)">
      <animateTransform attributeName="transform" type="rotate"
        values="-35; -28; -35" dur="3.4s" repeatCount="indefinite" additive="replace"/>
      <rect x="-7" y="-58" width="14" height="46" rx="6" fill="url(#gradME)"/>
      <rect x="-7" y="-46" width="14" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="-7" y="-36" width="14" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="-7" y="-26" width="14" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="-2.5" y="-12" width="5" height="60" rx="2" fill="url(#gradME)"/>
      <rect x="-4" y="48" width="8" height="10" rx="1" fill="url(#gradME)"/>
    </g>
  </g>

  <!-- 🪜 ESCALERA (7-8 en punto) -->
  <g transform="translate(132 275) scale(0.52)">
    <g transform="rotate(30)">
      <animateTransform attributeName="transform" type="rotate"
        values="30; 24; 30" dur="3.2s" repeatCount="indefinite" additive="replace"/>
      <rect x="-24" y="-90" width="8" height="100" rx="3" fill="url(#gradME)"/>
      <rect x="16" y="-90" width="8" height="100" rx="3" fill="url(#gradME)"/>
      <rect x="-24" y="-80" width="48" height="6" rx="3" fill="url(#gradME)"/>
      <rect x="-24" y="-62" width="48" height="6" rx="3" fill="url(#gradME)"/>
      <rect x="-24" y="-44" width="48" height="6" rx="3" fill="url(#gradME)"/>
      <rect x="-24" y="-26" width="48" height="6" rx="3" fill="url(#gradME)"/>
      <rect x="-24" y="-8"  width="48" height="6" rx="3" fill="url(#gradME)"/>
    </g>
  </g>

  <!-- 🥄 PALA (4-5 en punto) -->
  <g transform="translate(268 275) scale(0.52)">
    <g transform="rotate(-30)">
      <animateTransform attributeName="transform" type="rotate"
        values="-30; -24; -30" dur="3.6s" repeatCount="indefinite" additive="replace"/>
      <rect x="-5" y="-95" width="10" height="90" rx="4" fill="url(#gradME)"/>
      <rect x="-9" y="-102" width="18" height="14" rx="5" fill="url(#gradME)"/>
      <path d="M -20 -8 Q -26 22 -14 42 Q 0 56 14 42 Q 26 22 20 -8
               Q 0 -18 -20 -8 Z" fill="url(#gradME)"/>
      <path d="M -12 -4 Q -14 12 -8 28 Q -3 36 0 36 Q -6 22 -6 6 Z"
            fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- CHISPAS alrededor -->
  <g fill="#22C1E0">
    <circle cx="272" cy="110" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="110" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>