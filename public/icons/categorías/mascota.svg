<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="100%" height="100%" 
     xmlns="http://www.w3.org/2000/svg" role="img" 
     aria-label="Icono de mascota - Contrato Directo">

  <defs>
    <!-- Degradado azul → cian, igual que el logo -->
    <linearGradient id="gradCD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <!-- Degradado invertido para el aro exterior -->
    <linearGradient id="gradAro" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>
  </defs>

  <!-- Aro/ciclo exterior tipo "Contrato Directo" (flechas curvas) -->
  <g fill="none" stroke="url(#gradAro)" stroke-width="22" stroke-linecap="round">
    <!-- Arco superior izquierdo con punta de flecha -->
    <path d="M 110 200 A 90 90 0 0 1 200 110" />
    <!-- Arco superior derecho -->
    <path d="M 200 110 A 90 90 0 0 1 290 200" />
    <!-- Arco inferior derecho -->
    <path d="M 290 200 A 90 90 0 0 1 200 290" />
    <!-- Arco inferior izquierdo -->
    <path d="M 200 290 A 90 90 0 0 1 110 200" />
  </g>

  <!-- Cabeza de la mascota (silueta minimalista) -->
  <g fill="url(#gradCD)">
    <!-- Orejas -->
    <path d="M 150 150 L 140 115 L 178 138 Z" />
    <path d="M 250 150 L 260 115 L 222 138 Z" />
    <!-- Cabeza redondeada -->
    <circle cx="200" cy="200" r="55" />
    <!-- Hocico blanco -->
    <ellipse cx="200" cy="220" rx="30" ry="20" fill="#ffffff"/>
  </g>

  <!-- Ojos animados (parpadean) -->
  <g fill="#0A2A66">
    <circle cx="180" cy="192" r="7">
      <animate attributeName="ry" values="7;1;7" dur="4s" 
               repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
    </circle>
    <circle cx="220" cy="192" r="7">
      <animate attributeName="ry" values="7;1;7" dur="4s" 
               repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
    </circle>
  </g>

  <!-- Nariz -->
  <path d="M 195 215 L 205 215 L 200 222 Z" fill="#0A2A66"/>

  <!-- Cola que se mueve (movimiento de contento) -->
  <path d="M 255 235 Q 285 230 290 200" 
        stroke="url(#gradCD)" stroke-width="12" 
        stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate"
      values="-8 255 235; 8 255 235; -8 255 235"
      dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Pulso sutil de conexión (idea del logo: conectar) -->
  <circle cx="200" cy="200" r="130" fill="none"
          stroke="#22C1E0" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="110;140;110" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

</svg>