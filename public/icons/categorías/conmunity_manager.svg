<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Community Manager con RRSS - Contrato Directo">

  <defs>
    <!-- Degradado institucional azul → cian -->
    <linearGradient id="gradCM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <!-- Degradado invertido para el aro exterior -->
    <linearGradient id="gradAroCM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <!-- Resplandor del centro -->
    <radialGradient id="glowCM" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior tipo "ciclo" del logo institucional -->
  <g fill="none" stroke="url(#gradAroCM)" stroke-width="8"
     stroke-linecap="round" opacity="0.85">
    <path d="M 110 200 A 90 90 0 0 1 200 110" />
    <path d="M 200 110 A 90 90 0 0 1 290 200" />
    <path d="M 290 200 A 90 90 0 0 1 200 290" />
    <path d="M 200 290 A 90 90 0 0 1 110 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="40s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central pulsante -->
  <circle cx="200" cy="200" r="60" fill="url(#glowCM)">
    <animate attributeName="r" values="55;72;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Figura central (el Community Manager) -->
  <g fill="url(#gradCM)">
    <!-- Cabeza -->
    <circle cx="200" cy="180" r="26"/>
    <!-- Cuerpo / hombros -->
    <path d="M 155 250 
             Q 155 215 200 215 
             Q 245 215 245 250 
             Z"/>
  </g>
  <!-- Detalle interior de la cabeza (rostro) -->
  <circle cx="200" cy="180" r="14" fill="#ffffff" opacity="0.95"/>

  <!-- ÚNICO globo de conversación (achicado) -->
  <g>
    <path d="M 118 138 
             h 38 
             a 10 10 0 0 1 10 10 
             v 16 
             a 10 10 0 0 1 -10 10 
             h -24 
             l -12 10 
             v -10 
             h -2 
             a 10 10 0 0 1 -10 -10 
             v -16 
             a 10 10 0 0 1 10 -10 
             z"
          fill="url(#gradCM)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -5; 0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- Puntitos dentro del globo -->
    <g fill="#ffffff">
      <circle cx="138" cy="155" r="2.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="148" cy="155" r="2.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="158" cy="155" r="2.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- RRSS: Instagram (arriba derecha) -->
  <g transform="translate(285 115)">
    <rect x="-14" y="-14" width="28" height="28" rx="8" ry="8"
          fill="none" stroke="url(#gradCM)" stroke-width="4"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="url(#gradCM)" stroke-width="3.5"/>
    <circle cx="8" cy="-8" r="2" fill="#22C1E0">
      <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RRSS: Facebook (derecha) -->
  <g transform="translate(310 200)">
    <circle r="15" fill="url(#gradCM)"/>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif"
          font-size="18" font-weight="700" fill="#ffffff">f</text>
  </g>

  <!-- RRSS: X / Twitter (abajo derecha) -->
  <g transform="translate(285 285)">
    <circle r="14" fill="url(#gradCM)"/>
    <path d="M -6 -7 L 6 7 M 6 -7 L -6 7" stroke="#ffffff"
          stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- RRSS: TikTok (abajo izquierda) -->
  <g transform="translate(115 285)">
    <circle r="14" fill="url(#gradCM)"/>
    <path d="M -2 -8 L -2 4 Q -2 8 2 8 Q 6 8 6 4 Q 6 0 2 0 L 0 0"
          fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round"/>
    <path d="M 0 -8 L 6 -8" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- RRSS: YouTube (izquierda) -->
  <g transform="translate(90 200)">
    <rect x="-16" y="-11" width="32" height="22" rx="6" ry="6"
          fill="url(#gradCM)"/>
    <path d="M -4 -6 L 6 0 L -4 6 Z" fill="#ffffff"/>
  </g>

  <!-- Nodos de audiencia que orbitan (comunidad conectada) -->
  <g>
    <circle cx="200" cy="105" r="7" fill="#22C1E0">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="360 200 200" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="295" cy="200" r="5" fill="#1E6FE8">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="-360 200 200" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="295" r="6" fill="#0A2A66">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="360 200 200" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="200" r="5" fill="#22C1E0">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="-360 200 200" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ondas de comunicación desde el centro -->
  <g fill="none" stroke="#22C1E0" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <circle cx="200" cy="200" r="70">
      <animate attributeName="r" values="60;95;60" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="70">
      <animate attributeName="r" values="60;95;60" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>