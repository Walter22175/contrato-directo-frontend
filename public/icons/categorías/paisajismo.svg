<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Paisajismo - Contrato Directo">

  <defs>
    <linearGradient id="gradPAIS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroPAIS" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradCopa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#1E6FE8"/>
    </linearGradient>

    <radialGradient id="glowPAIS" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroPAIS)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowPAIS)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 🌳 ÁRBOL CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.95)">
    <g>
      <!-- Animación: el árbol se balancea suavemente -->
      <animateTransform attributeName="transform" type="rotate"
        values="-1.5 0 40; 1.5 0 40; -1.5 0 40" dur="4s" repeatCount="indefinite"/>

      <!-- Tronco -->
      <path d="M -6 40 L -4 5 Q -3 -2 0 -5 Q 3 -2 4 5 L 6 40 Z"
            fill="url(#gradPAIS)"/>

      <!-- Raíces -->
      <path d="M -14 40 Q -10 36 -6 40 M 14 40 Q 10 36 6 40"
            fill="none" stroke="url(#gradPAIS)" stroke-width="3"
            stroke-linecap="round"/>

      <!-- Copa del árbol (3 círculos superpuestos) -->
      <circle cx="-14" cy="-10" r="18" fill="url(#gradCopa)"/>
      <circle cx="14"  cy="-10" r="18" fill="url(#gradCopa)"/>
      <circle cx="0"   cy="-24" r="20" fill="url(#gradCopa)"/>

      <!-- Brillo superior de la copa -->
      <ellipse cx="-6" cy="-30" rx="10" ry="5" fill="#ffffff" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Detalles de hojas (puntitos) -->
      <circle cx="-10" cy="-18" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="12" cy="-14" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="4" cy="-30" r="2" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- ☀️ SOL (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="25s" repeatCount="indefinite"/>
      <!-- Rayos -->
      <g stroke="url(#gradPAIS)" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="-22"/>
        <line x1="0" y1="22" x2="0" y2="28"/>
        <line x1="-28" y1="0" x2="-22" y2="0"/>
        <line x1="22" y1="0" x2="28" y2="0"/>
        <line x1="-20" y1="-20" x2="-16" y2="-16"/>
        <line x1="16" y1="-16" x2="20" y2="-20"/>
        <line x1="-16" y1="16" x2="-20" y2="20"/>
        <line x1="16" y1="16" x2="20" y2="20"/>
      </g>
      <!-- Círculo central -->
      <circle r="14" fill="url(#gradPAIS)"/>
      <circle r="8" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- 🌱 BROTE / PLANTA (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Tallo -->
      <path d="M 0 22 Q 0 8 0 -6" stroke="url(#gradPAIS)"
            stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Hoja izquierda -->
      <path d="M 0 4 Q -18 0 -14 -12 Q -4 -10 0 4 Z"
            fill="url(#gradPAIS)"/>
      <!-- Hoja derecha -->
      <path d="M 0 -4 Q 18 -8 14 -20 Q 4 -18 0 -4 Z"
            fill="url(#gradPAIS)"/>
      <!-- Tierra -->
      <ellipse cx="0" cy="22" rx="16" ry="4" fill="url(#gradPAIS)" opacity="0.6"/>
    </g>
  </g>

  <!-- 💧 GOTA DE AGUA (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Gota -->
      <path d="M 0 -22
               Q -14 -4 -14 6
               Q -14 20 0 20
               Q 14 20 14 6
               Q 14 -4 0 -22 Z"
            fill="url(#gradPAIS)"/>
      <!-- Brillo de la gota -->
      <ellipse cx="-5" cy="4" rx="3" ry="6" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- 🪴 MACETA (3 en punto) -->
  <g transform="translate(282 200) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Planta en la maceta -->
      <path d="M 0 -6 Q -6 -18 -2 -24 Q 4 -22 0 -6 Z" fill="url(#gradPAIS)"/>
      <path d="M 0 -6 Q 6 -18 2 -24 Q -4 -22 0 -6 Z" fill="url(#gradPAIS)"/>
      <circle cx="0" cy="-24" r="3" fill="url(#gradPAIS)"/>
      <!-- Maceta (trapecio) -->
      <path d="M -16 -4 L 16 -4 L 12 22 L -12 22 Z"
            fill="url(#gradPAIS)"/>
      <!-- Borde superior de la maceta -->
      <rect x="-18" y="-8" width="36" height="6" rx="2" ry="2"
            fill="url(#gradPAIS)"/>
      <!-- Brillo de la maceta -->
      <path d="M -10 0 L -6 18 L -2 18 L -6 0 Z"
            fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- ✂️ TIJERAS DE PODAR (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.55)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-8; 8; -8" dur="3s" repeatCount="indefinite"/>
      <!-- Hoja 1 -->
      <path d="M -4 -22 Q -8 -8 -2 8 L 2 8 Q -4 -8 0 -22 Z"
            fill="url(#gradPAIS)"/>
      <!-- Hoja 2 -->
      <path d="M 4 -22 Q 8 -8 2 8 L -2 8 Q 4 -8 0 -22 Z"
            fill="url(#gradPAIS)"/>
      <!-- Mango 1 -->
      <ellipse cx="-12" cy="18" rx="6" ry="9" fill="none"
               stroke="url(#gradPAIS)" stroke-width="4"/>
      <!-- Mango 2 -->
      <ellipse cx="12" cy="18" rx="6" ry="9" fill="none"
               stroke="url(#gradPAIS)" stroke-width="4"/>
      <!-- Perno central -->
      <circle r="3" fill="url(#gradPAIS)"/>
    </g>
  </g>

  <!-- 🌿 HOJA / RAMA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="5; -5; 5" dur="3.4s" repeatCount="indefinite"/>
      <!-- Rama -->
      <path d="M -22 20 Q -4 6 22 -20" stroke="url(#gradPAIS)"
            stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Hoja 1 -->
      <path d="M -10 10 Q -18 0 -12 -6 Q -4 -4 -10 10 Z"
            fill="url(#gradPAIS)"/>
      <!-- Hoja 2 -->
      <path d="M 2 0 Q -6 -10 0 -16 Q 8 -14 2 0 Z"
            fill="url(#gradPAIS)"/>
      <!-- Hoja 3 -->
      <path d="M 12 -10 Q 4 -20 10 -26 Q 18 -24 12 -10 Z"
            fill="url(#gradPAIS)"/>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor (tipo polen) -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>