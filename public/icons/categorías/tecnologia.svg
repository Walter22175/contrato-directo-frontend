<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Tecnología - Contrato Directo">

  <defs>
    <linearGradient id="gradTEC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroTEC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPantalla" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowTEC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroTEC)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowTEC)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 💻 LAPTOP / MONITOR CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.85)">
    <!-- Pantalla -->
    <rect x="-40" y="-30" width="80" height="55" rx="6" ry="6"
          fill="url(#gradTEC)"/>
    <!-- Interior de pantalla -->
    <rect x="-34" y="-24" width="68" height="43" rx="4" ry="4"
          fill="url(#gradPantalla)"/>
    <!-- Líneas de código en pantalla -->
    <rect x="-28" y="-18" width="30" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="-28" y="-10" width="45" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="-28" y="-2"  width="22" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="-28" y="6"   width="40" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
    <!-- Base del monitor -->
    <rect x="-46" y="25" width="92" height="8" rx="4" ry="4"
          fill="url(#gradTEC)"/>
    <!-- Brillo de pantalla pulsante -->
    <rect x="-34" y="-24" width="68" height="43" rx="4" ry="4"
          fill="#ffffff" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 📡 ANTENA / SEÑAL (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- Ondas de señal -->
      <path d="M -18 -8 A 25 25 0 0 1 18 -8" fill="none"
            stroke="url(#gradTEC)" stroke-width="5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M -30 -18 A 42 42 0 0 1 30 -18" fill="none"
            stroke="url(#gradTEC)" stroke-width="5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Punto de emisión -->
      <circle cx="0" cy="6" r="7" fill="url(#gradTEC)"/>
    </g>
  </g>

  <!-- 🔌 CHIP / PROCESADOR (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Pines laterales -->
      <rect x="-30" y="-4" width="10" height="4" rx="1" fill="url(#gradTEC)"/>
      <rect x="-30" y="4"  width="10" height="4" rx="1" fill="url(#gradTEC)"/>
      <rect x="20"  y="-4" width="10" height="4" rx="1" fill="url(#gradTEC)"/>
      <rect x="20"  y="4"  width="10" height="4" rx="1" fill="url(#gradTEC)"/>
      <!-- Cuerpo del chip -->
      <rect x="-22" y="-18" width="44" height="36" rx="5" ry="5"
            fill="url(#gradTEC)"/>
      <!-- Núcleo interior -->
      <rect x="-12" y="-9" width="24" height="18" rx="3" ry="3"
            fill="#ffffff" opacity="0.9"/>
      <!-- Circuito interior -->
      <rect x="-8" y="-5" width="16" height="10" rx="2" ry="2"
            fill="url(#gradTEC)">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ☁️ NUBE / CLOUD (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -5; 0 0" dur="3s" repeatCount="indefinite"/>
      <!-- Cuerpo de la nube -->
      <path d="M -30 8
               Q -38 8 -38 0
               Q -38 -10 -28 -10
               Q -26 -22 -14 -22
               Q -2 -22 2 -14
               Q 10 -18 18 -12
               Q 30 -12 30 0
               Q 30 8 22 8 Z"
            fill="url(#gradTEC)"/>
      <!-- Símbolo de sincronización en la nube -->
      <path d="M -8 0 A 6 6 0 1 1 -2 -5"
            fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" opacity="0.9"/>
      <path d="M 8 0 A 6 6 0 1 1 2 5"
            fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- 🔗 NODOS CONECTADOS / IoT (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-8; 8; -8" dur="3.2s" repeatCount="indefinite"/>
      <!-- Líneas de conexión -->
      <line x1="0" y1="0" x2="-22" y2="-22" stroke="url(#gradTEC)"
            stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-22" y2="22" stroke="url(#gradTEC)"
            stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="22" y2="-22" stroke="url(#gradTEC)"
            stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="22" y2="22" stroke="url(#gradTEC)"
            stroke-width="3" stroke-linecap="round"/>
      <!-- Nodos -->
      <circle cx="-22" cy="-22" r="7" fill="url(#gradTEC)"/>
      <circle cx="-22" cy="22"  r="7" fill="url(#gradTEC)"/>
      <circle cx="22"  cy="-22" r="7" fill="url(#gradTEC)"/>
      <circle cx="22"  cy="22"  r="7" fill="url(#gradTEC)"/>
      <!-- Nodo central -->
      <circle cx="0" cy="0" r="10" fill="url(#gradTEC)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.95">
        <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ⚡ RAYO (1-2 en punto, energía) -->
  <g transform="translate(288 118) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.15 1.15; 1 1" dur="1.5s" repeatCount="indefinite"/>
      <path d="M 2 -26 L -14 4 L -2 4 L -8 26 L 14 -6 L 2 -6 Z"
            fill="url(#gradTEC)"/>
      <path d="M 2 -26 L -14 4 L -2 4 L -8 26 L 14 -6 L 2 -6 Z"
            fill="#ffffff" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.05;0.25" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 📶 WiFi (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0; 0 0 0" dur="3s" repeatCount="indefinite"/>
      <!-- Punto base -->
      <circle cx="0" cy="18" r="5" fill="url(#gradTEC)"/>
      <!-- Arcos de señal -->
      <path d="M -14 6 A 20 20 0 0 1 14 6" fill="none"
            stroke="url(#gradTEC)" stroke-width="4.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M -24 -8 A 34 34 0 0 1 24 -8" fill="none"
            stroke="url(#gradTEC)" stroke-width="4.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="110" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="110" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>