<?xml version="1.0" encoding="UTF-8"?>

<svg viewBox="0 0 400 400" width="100%" height="100%"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Icono de Software - Contrato Directo">

  <defs>
    <linearGradient id="gradSW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A2A66"/>
      <stop offset="55%"  stop-color="#1E6FE8"/>
      <stop offset="100%" stop-color="#22C1E0"/>
    </linearGradient>

    <linearGradient id="gradAroSW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22C1E0"/>
      <stop offset="100%" stop-color="#0A2A66"/>
    </linearGradient>

    <linearGradient id="gradPantallaSW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowSW" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22C1E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C1E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aro exterior institucional -->
  <g fill="none" stroke="url(#gradAroSW)" stroke-width="7"
     stroke-linecap="round" opacity="0.85">
    <path d="M 70 200 A 130 130 0 0 1 200 70" />
    <path d="M 200 70 A 130 130 0 0 1 330 200" />
    <path d="M 330 200 A 130 130 0 0 1 200 330" />
    <path d="M 200 330 A 130 130 0 0 1 70 200" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="50s" repeatCount="indefinite"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="200" cy="200" r="95" fill="url(#glowSW)">
    <animate attributeName="r" values="90;110;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 💻 VENTANA DE CÓDIGO CENTRAL (núcleo) -->
  <g transform="translate(200 200) scale(0.9)">
    <!-- Marco de ventana -->
    <rect x="-50" y="-38" width="100" height="76" rx="8" ry="8"
          fill="url(#gradSW)"/>
    <!-- Barra superior de ventana -->
    <rect x="-50" y="-38" width="100" height="14" rx="8" ry="8"
          fill="#0A2A66" opacity="0.7"/>
    <!-- Botones de ventana (3 puntos) -->
    <circle cx="-40" cy="-31" r="3" fill="#22C1E0"/>
    <circle cx="-30" cy="-31" r="3" fill="#1E6FE8"/>
    <circle cx="-20" cy="-31" r="3" fill="#ffffff" opacity="0.6"/>
    <!-- Pantalla interior -->
    <rect x="-44" y="-18" width="88" height="50" rx="4" ry="4"
          fill="url(#gradPantallaSW)"/>
    <!-- Líneas de código animadas -->
    <rect x="-38" y="-12" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9">
      <animate attributeName="width" values="30;50;30" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-38" y="-4" width="55" height="4" rx="2" fill="#ffffff" opacity="0.7">
      <animate attributeName="width" values="55;35;55" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-38" y="4" width="22" height="4" rx="2" fill="#ffffff" opacity="0.8">
      <animate attributeName="width" values="22;48;22" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-38" y="12" width="45" height="4" rx="2" fill="#ffffff" opacity="0.6">
      <animate attributeName="width" values="45;25;45" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-38" y="20" width="35" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
    <!-- Cursor parpadeante -->
    <rect x="0" y="18" width="3" height="8" fill="#22C1E0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 📦 PAQUETE / MÓDULO (12 en punto) -->
  <g transform="translate(200 118) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="2.6s" repeatCount="indefinite"/>
      <!-- Caja 3D isométrica -->
      <path d="M 0 -22 L 22 -10 L 22 14 L 0 26 L -22 14 L -22 -10 Z"
            fill="url(#gradSW)"/>
      <!-- Tapa superior -->
      <path d="M 0 -22 L 22 -10 L 0 2 L -22 -10 Z"
            fill="#22C1E0" opacity="0.85"/>
      <!-- Línea central -->
      <line x1="0" y1="2" x2="0" y2="26" stroke="#ffffff"
            stroke-width="2" opacity="0.5"/>
      <!-- Brillo -->
      <path d="M -14 -12 L -6 -16 L -6 -8 L -14 -4 Z"
            fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- 🗄️ BASE DE DATOS (6 en punto) -->
  <g transform="translate(200 288) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4; 0 0" dur="3s" repeatCount="indefinite"/>
      <!-- Cilindros apilados (3 discos) -->
      <ellipse cx="0" cy="-18" rx="26" ry="7" fill="url(#gradSW)"/>
      <rect x="-26" y="-18" width="52" height="12" fill="url(#gradSW)"/>
      <ellipse cx="0" cy="-6" rx="26" ry="7" fill="#22C1E0" opacity="0.85"/>
      <rect x="-26" y="-6" width="52" height="12" fill="url(#gradSW)"/>
      <ellipse cx="0" cy="6" rx="26" ry="7" fill="#22C1E0" opacity="0.85"/>
      <rect x="-26" y="6" width="52" height="12" fill="url(#gradSW)"/>
      <ellipse cx="0" cy="18" rx="26" ry="7" fill="url(#gradSW)"/>
      <!-- Brillo -->
      <ellipse cx="-10" cy="-18" rx="8" ry="3" fill="#ffffff" opacity="0.35"/>
      <!-- LED de actividad -->
      <circle cx="18" cy="-18" r="2.5" fill="#22C1E0">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 🔀 DIAGRAMA DE FLUJO (9 en punto) -->
  <g transform="translate(118 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-5; 5; -5" dur="3.4s" repeatCount="indefinite"/>
      <!-- Nodo inicio -->
      <circle cx="-18" cy="-18" r="7" fill="url(#gradSW)"/>
      <!-- Nodo proceso -->
      <rect x="-8" y="8" width="16" height="16" rx="3" ry="3"
            fill="url(#gradSW)"/>
      <!-- Nodo decisión (rombo) -->
      <path d="M 18 -18 L 26 -10 L 18 -2 L 10 -10 Z" fill="url(#gradSW)"/>
      <!-- Nodo fin -->
      <circle cx="-18" cy="18" r="6" fill="#22C1E0" opacity="0.85"/>
      <!-- Flechas conectoras -->
      <path d="M -14 -13 L -2 6" stroke="url(#gradSW)" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>
      <path d="M 8 16 L 16 -4" stroke="url(#gradSW)" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>
      <path d="M -8 24 L -12 18" stroke="url(#gradSW)" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>
      <!-- Destello en el flujo -->
      <circle r="3" fill="#22C1E0">
        <animateMotion dur="2.5s" repeatCount="indefinite"
          path="M -18 -18 L 0 16 L 18 -10 L -18 18"/>
      </circle>
    </g>
  </g>

  <!-- 🐛 BUG / TESTING (3 en punto) -->
  <g transform="translate(282 200) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0; -8 0 0; 0 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Cuerpo del bug -->
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="url(#gradSW)"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-22" r="9" fill="url(#gradSW)"/>
      <!-- Ojos -->
      <circle cx="-4" cy="-24" r="2.5" fill="#ffffff"/>
      <circle cx="4" cy="-24" r="2.5" fill="#ffffff"/>
      <!-- Antenas -->
      <line x1="-5" y1="-30" x2="-10" y2="-40" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="-30" x2="10" y2="-40" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <!-- Patas (6) -->
      <line x1="-16" y1="-8" x2="-26" y2="-14" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="-8" x2="26" y2="-14" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="4" x2="-28" y2="4" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="4" x2="28" y2="4" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="14" x2="-26" y2="20" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="14" x2="26" y2="20" stroke="url(#gradSW)"
            stroke-width="2.5" stroke-linecap="round"/>
      <!-- Línea central del cuerpo -->
      <line x1="0" y1="-12" x2="0" y2="16" stroke="#ffffff"
            stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- ⚙️ API / CONFIGURACIÓN (10-11 en punto) -->
  <g transform="translate(118 118) scale(0.58)">
    <g>
      <!-- Dientes del engranaje -->
      <path d="M 0 -20 L 5 -20 L 5 -15 L -5 -15 L -5 -20 Z
               M 0 20 L 5 20 L 5 15 L -5 15 L -5 20 Z
               M -20 0 L -20 -5 L -15 -5 L -15 5 L -20 5 Z
               M 20 0 L 20 -5 L 15 -5 L 15 5 L 20 5 Z
               M -14 -14 L -11 -17 L -14 -20 L -17 -17 Z
               M 14 -14 L 17 -17 L 14 -20 L 11 -17 Z
               M -14 14 L -17 17 L -14 20 L -11 17 Z
               M 14 14 L 11 17 L 14 20 L 17 17 Z"
            fill="url(#gradSW)"/>
      <circle r="14" fill="url(#gradSW)"/>
      <circle r="6" fill="#ffffff" opacity="0.95"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 🔧 TERMINAL / CONSOLA (1-2 en punto) -->
  <g transform="translate(282 118) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3; 0 0" dur="2.8s" repeatCount="indefinite"/>
      <!-- Marco de terminal -->
      <rect x="-22" y="-18" width="44" height="36" rx="5" ry="5"
            fill="#0A2A66" opacity="0.9"/>
      <!-- Barra superior -->
      <rect x="-22" y="-18" width="44" height="8" rx="5" ry="5"
            fill="url(#gradSW)"/>
      <!-- Prompt -->
      <text x="-14" y="4" font-family="monospace" font-size="10"
            fill="#22C1E0" font-weight="700">&gt;_</text>
      <!-- Línea de comando parpadeante -->
      <rect x="-14" y="8" width="20" height="2" fill="#22C1E0">
        <animate attributeName="width" values="20;30;20" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- CHISPAS / partículas alrededor -->
  <g fill="#22C1E0">
    <circle cx="270" cy="105" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="105" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="272" r="3">
      <animate attributeName="r" values="2;5;2" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="272" r="3.5">
      <animate attributeName="r" values="2.5;6;2.5" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>